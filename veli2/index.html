<!DOCTYPE html>
<html lang="ka">
<head>
<title>JDE vs MEGAKO</title>
<base target="_blank">
<meta charset="utf-8">
<meta name="theme-color" content="#0e7c66"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,400..800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F6F7FB;--surface:#fff;--sunk:#EEF1F7;--ink:#151B2E;--muted:#5D6680;--line:#DDE2EE;
  --accent:#1E3A8A;--accent-ink:#fff;--accent-soft:#E3E9F8;--warn:#9A5B05;--warn-soft:#FBEFD9;
  --bad:#B3261E;--bad-soft:#F8E0DD;--ok:#21733B;--ok-soft:#DFF1E5;--info:#2D5A97;--info-soft:#E1E9F5;
  --promo:#B4235A;--promo-soft:#FBE3EC;
  --f:"Noto Sans Georgian",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0E1220;--surface:#161B2C;--sunk:#111626;--ink:#E6E9F2;--muted:#98A1B8;--line:#2A3148;
  --accent:#8EA8F0;--accent-ink:#0E1530;--accent-soft:#1F2A4D;--warn:#E8B062;--warn-soft:#3A2C12;--bad:#EF8A80;--bad-soft:#3E201C;
  --ok:#7DCB93;--ok-soft:#183223;--info:#90B5EA;--info-soft:#1B2A40;--promo:#F28BB1;--promo-soft:#3D1A28;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-stretch:75%;font-weight:800;font-size:30px;line-height:1.1;margin:0}
.top .sub{color:var(--muted);font-size:14px}
.top .right{margin-left:auto;display:flex;gap:6px}
h2{font-stretch:75%;font-weight:800;font-size:22px;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;min-height:42px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}.btn.wa{color:var(--ok)}.btn.vb{color:var(--info)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{min-height:56px;font-size:17px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat.good b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.bar{height:5px;background:var(--sunk);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
@media (max-width:480px){.tabs button{padding:10px 8px;font-size:14px}}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.count{font-size:11.5px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px;margin-left:6px;font-family:var(--mono)}
.count.hot{background:var(--accent);color:var(--accent-ink)}
.count.pr{background:var(--promo);color:#fff}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qa .line{width:100%;border:0;background:transparent;font-size:16px;padding:6px 4px;min-height:40px;outline:none}
.qa .opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qa .opts select{width:auto;min-width:150px}
.qa .opts .cb{width:230px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qa .add{margin-left:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input{flex:1 1 220px;width:auto}
.filters select,.filters input[type=date]{width:auto;flex:0 1 180px}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.cb{position:relative}
.cbl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:300px;overflow-y:auto;min-width:240px}
.cbl button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.cbl button:last-child{border-bottom:0}
.cbl button:hover,.cbl button:focus{background:var(--sunk)}
.cbl button span{display:block;font-size:12.5px;color:var(--muted)}
.cbl .sec{padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunk);letter-spacing:.03em}
.cbl .none{padding:12px;color:var(--muted);font-size:13.5px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px;white-space:nowrap}
tr.trow{cursor:pointer}
tr.trow:hover td{background:var(--sunk)}
tr.trow td:first-child{border-left:4px solid transparent}
tr.trow.st-late td:first-child{border-left-color:var(--bad)}
tr.trow.st-rev td:first-child{border-left-color:var(--accent)}
tr.trow.st-ret td:first-child,tr.trow.st-today td:first-child{border-left-color:var(--warn)}
td.title{font-weight:600;min-width:200px}
td.note{color:var(--muted);font-size:13px;max-width:260px}
td.nowrap{white-space:nowrap}
tr.detail td{background:var(--sunk);padding:16px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-ღია{background:var(--info-soft);color:var(--info)}
.s-დაბრუნებული{background:var(--warn-soft);color:var(--warn)}
.s-შესრულებული{background:var(--accent-soft);color:var(--accent)}
.s-დადასტურებული{background:var(--ok-soft);color:var(--ok)}
.w-late{background:var(--bad-soft);color:var(--bad)}.w-soon{background:var(--warn-soft);color:var(--warn)}
.p-pr{background:var(--promo-soft);color:var(--promo)}
.kind{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);font-stretch:80%}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.nbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.nbox.mgr{background:var(--warn-soft);border-color:transparent}
.nbox label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;padding:0;font-size:16px}
.ph{font-family:var(--mono);font-size:13px;color:var(--muted)}
.addph{width:84px;height:84px;border:1.5px dashed var(--muted);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;line-height:1.2}
.addph b{font-size:24px;font-weight:400}
.addph input,.cam input,.upl input{display:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.unseen{border-color:var(--accent)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.who button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:16px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:8px 10px;border-radius:8px}
.aform{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.step .n{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-right:8px}
.step h3{display:flex;align-items:center;font-size:17px}
.step select,.step input,.step textarea{font-size:16px}
.cam,.upl{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:2px dashed var(--accent);border-radius:12px;color:var(--accent);font-weight:700;font-size:17px;cursor:pointer;background:var(--accent-soft);text-align:center;padding:8px}
.upl{font-size:15px;min-height:56px}
.tinfo{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mylist{display:flex;flex-direction:column;gap:6px}
.mylist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mylist button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--promo-soft);color:var(--promo);border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer;border:0;width:100%;text-align:left}
.pgrp{display:flex;flex-direction:column;gap:8px}
.pgrp h3{font-size:16px;display:flex;align-items:center;gap:8px}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pitem .nm{font-weight:600;overflow-wrap:anywhere}
.pitem .pr{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--promo);text-align:right;white-space:nowrap}
.pitem .old{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:line-through;text-align:right}
.pitem .meta{font-size:12.5px;color:var(--muted)}
.ngrp{display:flex;flex-direction:column;gap:8px}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:14px;cursor:pointer;font-size:16px}
.nhead.on{background:var(--accent-soft);border-color:var(--accent)}
.nhead b{display:block;font-size:17px}
.nhead .sum{font-family:var(--mono);font-weight:700;white-space:nowrap}
.nhead .chev{color:var(--accent);margin-left:4px}
.ngrp .box{padding-left:10px;border-left:3px solid var(--accent-soft)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ohead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.ohead b{display:block;font-size:15.5px}
.ohead .sum{font-family:var(--mono);font-weight:700;white-space:nowrap;text-align:right}
.olines{border-top:1px solid var(--line)}
.oline{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.oline:first-child{border-top:0}
.oline.tap{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.oline.ok{background:var(--ok-soft)}
.oline.ok>div:first-child{color:var(--ok);font-weight:600}
.oline.ok>div:first-child::before{content:"✓ ";font-weight:800}
.oline.ok .q{color:var(--ok)}
.ocard.done{border-color:var(--ok)}
.ocard.done .ohead b{color:var(--ok)}
.okc{color:var(--ok);font-weight:700}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:10px 14px;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink)}
.chead:first-child{border-top:0}
.chead .small{font-weight:500;color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:12px}
.chead.done{background:var(--ok-soft);color:var(--ok)}
.nhead.done{background:var(--ok-soft);border-color:var(--ok)}
.nhead.done b{color:var(--ok)}
.oline .q{font-family:var(--mono);font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.oline .s{font-size:12px;color:var(--muted)}
.oline .s.r{text-align:right;font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:15px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:calc(100% - 170px);margin-bottom:90px;object-fit:contain;touch-action:pan-y}
.lb{flex-direction:column;gap:10px}
.lb img{touch-action:none;transform-origin:center center;will-change:transform;cursor:zoom-in}
.lb img.zd{cursor:grab}
.lbz{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2}
.lbz button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
.lbz button[hidden]{display:none}
.lbx{z-index:2}.lbn{z-index:2}.lbbar{z-index:2}
.pgal .card .thumbs .thumb{width:84px;height:84px}
.abline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbx{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
.lbn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:34px;cursor:pointer;line-height:1}
.lbp{left:8px}.lbnx{right:8px}
.lbn[hidden]{display:none}
.lbbar{position:absolute;left:8px;right:8px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;color:#fff}
.lbbar button,.lbbar a{border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.lbbar .lbsh{background:#25D366;color:#06210f;font-weight:700}
#lbc{font-family:var(--mono);font-size:14px;opacity:.85}
.login{max-width:420px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.login input{font-size:22px;letter-spacing:.3em;text-align:center;font-family:var(--mono)}
.chat{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msgs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;height:min(62vh,640px);overflow-y:auto}
.msg{max-width:82%;align-self:flex-start;background:var(--sunk);border-radius:12px 12px 12px 4px;padding:8px 11px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-radius:12px 12px 4px 12px}
.msg.mgr .au{color:var(--promo)}
.msg .au{font-size:12.5px;font-weight:700;color:var(--accent)}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tm{font-size:11.5px;color:var(--muted);font-family:var(--mono);text-align:right}
.msg .thumbs{margin-top:4px}
.dsep{align-self:center;font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{min-height:48px;flex:1}
.cin .addph{width:48px;height:48px;flex:none}
.cin .btn{min-height:48px}
@media (max-width:900px){input,select,textarea{font-size:16px!important}.login input{font-size:22px!important}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.home{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:space-between;text-align:left;min-height:118px;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;color:var(--ink);font:inherit}
.tile .ic{font-size:28px;line-height:1}
.tile b{font-size:16px;line-height:1.25}
.tile .small{color:var(--muted)}
.tile .count{position:absolute;top:10px;right:10px;margin:0}
.tile.wide{grid-column:1/-1;min-height:60px;flex-direction:row;align-items:center;justify-content:flex-start}
.tile:active{transform:scale(.98)}
.banner.hotb{background:var(--accent-soft);color:var(--accent)}
.back{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back h2{margin:0}
.dtabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.dtabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.dtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dtabs button small{display:block;font-size:11.5px;opacity:.8}
.tcard,.tsk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard.has{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.tsk.new,.fitem.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tnote{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.dchips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dchips span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.ptype{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
.ptype h2{margin:0}
.ptype.shock h2,.ptype.shock h3{color:var(--bad)}
.ostats{grid-template-columns:1fr 1fr}
.ostats .stat{padding:12px 14px;min-width:0}
.ostats .stat:first-child{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
.ostats .stat:last-child{border-right:0}
.ostats .stat b{font-size:21px;white-space:nowrap;display:block}
.ostats .stat b small{font-size:14px;font-weight:600;margin-left:3px}
@media (min-width:700px){.ostats{grid-template-columns:repeat(3,1fr)}.ostats .stat:first-child{grid-column:auto;border-right:1px solid var(--line);border-bottom:0}}
.ptype h3{margin:0;font-size:16px}
button.ptype,button.pgh{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card,#fff);min-height:44px}
button.ptype{margin-top:8px;flex-wrap:nowrap}
button.ptype>h2,button.ptype>h3{flex:none}
button.ptype>.small{flex:1;min-width:0}
button.pgh{font-weight:700;font-size:16px;padding:8px 12px;border-radius:10px}
button.ptype:focus-visible,button.pgh:focus-visible{outline:2px solid var(--acc,#2563eb);outline-offset:2px}
.parr{margin-left:auto;font-size:18px;opacity:.7}
.pbody{display:flex;flex-direction:column;gap:8px;padding-left:6px}
.fitem{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;color:var(--ink);text-decoration:none}
.netg h3{font-size:15px;margin:6px 0 0;color:var(--muted)}
tr.edit input{min-height:38px;padding:6px 8px}
[hidden]{display:none!important}

/* ===== v2: დისტრიბუციის სტილის თემა ===== */
:root{--bg:#f4f6fa;--surface:#fff;--sunk:#eef1f5;--ink:#0f1b2d;--ink2:#334155;--muted:#64748b;--line:#e6eaf0;--line2:#eef1f5;
  --accent:#0e7c66;--accent2:#12a383;--accent-ink:#fff;--accent-soft:#e7f5f1;--accent-softer:#f3faf8;
  --warn:#b45309;--warn-soft:#fef4dc;--bad:#c2261c;--bad-soft:#fdecea;--ok:#13804a;--ok-soft:#e2f6ea;--info:#2952cc;--info-soft:#e8eefe;
  --promo:#c0265a;--promo-soft:#fde9ef;
  --side:#0c1f1b;--side-ink:#cfe3dd;--side-mute:#7fa198;--sidew:252px;--radius:14px;
  --sh1:0 1px 2px rgba(15,27,45,.05),0 1px 3px rgba(15,27,45,.04);--sh2:0 6px 24px rgba(15,27,45,.08),0 2px 6px rgba(15,27,45,.05);
  --f:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#f4f6fa;--surface:#fff;--sunk:#eef1f5;--ink:#0f1b2d;--muted:#64748b;--line:#e6eaf0;
  --accent:#0e7c66;--accent-ink:#fff;--accent-soft:#e7f5f1;--warn:#b45309;--warn-soft:#fef4dc;--bad:#c2261c;--bad-soft:#fdecea;
  --ok:#13804a;--ok-soft:#e2f6ea;--info:#2952cc;--info-soft:#e8eefe;--promo:#c0265a;--promo-soft:#fde9ef;color-scheme:light}}
html,body{background:var(--bg)}
body{font:14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
::selection{background:#bfe8dc}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top h1,h2{font-stretch:normal;letter-spacing:-.3px}
.top h1{font-size:24px;font-weight:700}
h2{font-size:20px;font-weight:700}
.mono{font-family:var(--f);font-variant-numeric:tabular-nums;font-size:13px}

/* ---------- ღილაკები, ველები ---------- */
.btn{border-radius:10px;border:1px solid #dbe1e8;box-shadow:var(--sh1);min-height:40px;transition:filter .12s,transform .06s,border-color .12s}
.btn:hover{border-color:#c3ccd6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 1px 2px rgba(14,124,102,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.okb{background:linear-gradient(180deg,#18a05d,var(--ok));border-color:transparent}
.btn.ghost{background:#fff;border-color:#dbe1e8;color:var(--ink2)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad);box-shadow:none}
.btn.big{min-height:52px;border-radius:12px}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=number],select,textarea{border:1px solid #dbe1e8;border-radius:10px;min-height:40px;padding:9px 12px;transition:border-color .12s,box-shadow .12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(18,163,131,.16)}
.chip{border-color:#dbe1e8;font-weight:500;color:var(--ink2);min-height:34px;transition:all .12s}
.chip:hover{border-color:#b9c4cf}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.count{font-family:var(--f);font-weight:700;background:var(--sunk)}
.count.hot{background:#e5484d;color:#fff}
.count.pr{background:var(--promo);color:#fff}

/* ---------- ბარათები ---------- */
.qa,.card,.box,.tinfo,.step,.ocard,.tcard,.pgrp,.tbl,.stats,.cbl{border-color:var(--line);box-shadow:var(--sh1)}
.qa,.card,.step{border-radius:var(--radius)}
.stats{border-radius:var(--radius);gap:0}
.stat b{font-family:var(--f);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.empty{border-radius:var(--radius)}
th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:12px}
tbody tr:hover td{background:#fafcfd}
.toast{background:#0f1b2d;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- აგენტის მთავარი: ფილები ---------- */
.home{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.home{grid-template-columns:repeat(3,1fr)}}
.home .tile{position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;padding:16px;min-height:132px;text-align:left;box-shadow:var(--sh1);transition:transform .1s,box-shadow .15s,border-color .15s}
.home .tile:hover{box-shadow:var(--sh2);border-color:#d3dde5;transform:translateY(-1px)}
.home .tile:active{transform:scale(.98)}
.home .tile .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:8px;font-size:22px;background:#e7f5f1}
.home .tile b{font-size:15.5px;font-weight:700}
.home .tile .small{color:var(--muted);font-size:12.5px;line-height:1.35}
.home .tile .count{position:absolute;top:14px;right:14px;min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;margin:0;padding:0 8px;font-size:12.5px;box-shadow:0 2px 8px rgba(229,72,77,.35)}
.home .tile:nth-child(1) .ic{background:#e7f5f1}.home .tile:nth-child(2) .ic{background:#e8eefe}.home .tile:nth-child(3) .ic{background:#fde9ef}
.home .tile:nth-child(4) .ic{background:#fef4dc}.home .tile:nth-child(5) .ic{background:#f1e9fe}.home .tile:nth-child(6) .ic{background:#e1f5fb}
.home .tile.wide{grid-column:1/-1;min-height:64px;flex-direction:row;align-items:center;gap:12px}
.home .tile.wide .ic{margin:0}

/* ---------- ზედა ზოლი ---------- */
.v2top{position:sticky;top:0;z-index:20;margin:0 -16px 4px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:rgba(244,246,250,.85);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:58px}
.v2top .tt{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2top .tt small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.1}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none;box-shadow:var(--sh1)}
.ib:hover{color:var(--accent);border-color:#cfe3dd}
.lgm{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:0 4px 14px rgba(18,163,131,.35);flex:none}

/* ---------- მენეჯერის გვერდითი მენიუ ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--sidew);background:linear-gradient(180deg,var(--side),#0a1916);color:var(--side-ink);display:flex;flex-direction:column;z-index:45;transform:translateX(-100%);transition:transform .22s ease;padding:calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.side.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.side-bg{position:fixed;inset:0;background:rgba(8,18,16,.45);backdrop-filter:blur(2px);z-index:44;display:none}
.side.open+.side-bg{display:block}
.brandbox{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brandbox .bn{font-weight:700;color:#fff;font-size:15px;line-height:1.15}
.brandbox .bs{font-size:11.5px;color:var(--side-mute)}
.navs{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.ng{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;cursor:pointer;font:inherit;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--side-mute);padding:12px 10px 8px;font-weight:600;text-align:left;border-radius:8px}
.ng:hover{color:var(--side-ink);background:rgba(255,255,255,.04)}
.ng span:first-child{flex:1}
.ng .chev{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;transition:transform .18s;transform:rotate(-90deg)}
.ng.op .chev{transform:none}
.ng .nc{text-transform:none;letter-spacing:0}
.ni{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;font-size:14px;position:relative}
.ni:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.on{background:rgba(18,163,131,.18);color:#fff}
.ni.on::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent2)}
.ni .nc{margin-left:auto;background:#e5484d;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;min-width:20px;text-align:center;line-height:19px}
.ni .nc.pr{background:var(--promo)}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);margin-top:10px}
.ucard .av2{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2fbf9b,#0e7c66);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ucard .un{font-weight:600;color:#fff;font-size:13.5px;line-height:1.2}
.ucard .ur{font-size:11.5px;color:var(--side-mute)}
.ucard button{margin-left:auto;background:none;border:0;color:var(--side-mute);cursor:pointer;padding:6px;border-radius:8px}
.ucard button:hover{color:#fff;background:rgba(255,255,255,.08)}
body.mgr .tabs{display:none}
@media(min-width:1000px){
  .side{transform:none}
  .side-bg,.mb{display:none!important}
  body.mgr .wrap{margin-left:var(--sidew);max-width:none;padding:0 28px}
  body.mgr main{max-width:1180px;margin:0 auto}
}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--sh1)}
.kpi .muted{font-size:12.5px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.good .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.acc .v{color:var(--accent)}
.kpi .progress{height:8px;border-radius:99px;background:#e9edf2;overflow:hidden;margin-top:8px}
.kpi .progress div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}

/* ---------- შესვლა ---------- */
body.auth{background:radial-gradient(1200px 600px at 10% -10%,#d7f2ea,transparent),radial-gradient(900px 500px at 110% 110%,#dfe8fb,transparent),var(--bg);min-height:100vh}
.authc{max-width:440px;margin:6vh auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh2)}
.authc .lgm{width:48px;height:48px;border-radius:14px;margin-bottom:14px;font-size:15px}
.authc h1{font-size:22px;margin:0 0 2px}
.who button{border-radius:14px;box-shadow:var(--sh1);border-color:var(--line)}
.who button:hover{border-color:var(--accent2);background:var(--accent-softer)}
.av{background:linear-gradient(135deg,#2fbf9b,#0e7c66)!important;color:#fff!important}
.v2badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;vertical-align:middle;margin-left:6px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(3,1fr);gap:8px}.kpi{padding:10px 11px}.kpi .v{font-size:18px}.kpi .muted{font-size:11px;line-height:1.25}}

/* KAM */
.kbar{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.kbar .row{gap:8px;flex-wrap:wrap;align-items:center}
.kbar select,.kbar input{width:auto;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{font-weight:700;margin-left:2px}
.kd{display:inline-block;font-size:12.5px;font-weight:600;margin-top:4px;color:var(--muted)}
.kd.up{color:var(--ok)}.kd.down{color:var(--bad)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--sh1);margin:14px 0;min-width:0}
.kh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:900px){.kgrid{grid-template-columns:1fr}}
.ktw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.kt th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;position:sticky;top:0;background:#fff}
.kt td{border-bottom:1px solid #f0f2f5;padding:7px 8px;vertical-align:top}
.kt td:nth-child(n+2){white-space:nowrap}
.kt td:first-child{min-width:150px}
.kt td.kw{white-space:normal;min-width:240px;max-width:420px}
.kts td:first-child{min-width:240px;white-space:normal}
.kt tr.kclick{cursor:pointer}.kt tr.kclick:hover td{background:#f4faf8}
.kt tr.kbad td{background:#fff6f5}.kt tr.kdim td{color:var(--muted)}
.kbarc,.kdist{height:7px;border-radius:9px;background:#eef1f4;overflow:hidden;min-width:60px}
.kdist{display:inline-block;width:60px;vertical-align:middle;margin-right:6px}
.kbarc div,.kdist div{height:100%;background:var(--accent)}
.kstar{color:#e0a100}
.kred{color:var(--bad)}
.klg{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.klg i{display:inline-block;width:10px;height:10px;border-radius:3px}.klg i.c1{background:var(--accent)}.klg i.c0{background:#c9d3dc;margin-left:8px}
.kch{display:flex;align-items:flex-end;height:220px;gap:0;padding-top:16px}
.kcol{display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.kbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:70%;max-width:56px}
.kbars div{flex:1;border-radius:4px 4px 0 0;min-height:1px}.kbars .b0{background:#c9d3dc}.kbars .b1{background:var(--accent)}
.kv{font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap}.km{font-size:12px;font-weight:600}
@media(max-width:600px){.kv{display:none}}
.kload{opacity:.55}
.kprog{height:8px;border-radius:9px;background:#eef1f4;overflow:hidden;margin:12px 0}.kprog div{height:100%;background:var(--accent);transition:width .3s}
.klog{font-size:13px;margin-top:10px;display:flex;flex-direction:column;gap:3px}
label.btn.disabled{opacity:.6;pointer-events:none}

.tmframe{display:block;width:100%;height:calc(100vh - 96px);min-height:520px;border:1px solid var(--line);border-radius:var(--radius);background:#f3f5fa}
@media(max-width:999px){.tmframe{height:calc(100vh - 80px)}}

/* ჩემი ქსელები (გვერდითა მენიუ) */
.nn0 .chev2,.nn1 .chev2{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;margin-left:auto;transform:rotate(-90deg);transition:transform .18s;flex:none}
.chev2.op{transform:none}
.nnl{margin:2px 0 6px 18px;border-left:1px solid rgba(255,255,255,.08);padding-left:6px}
.nn1,.nn2{display:flex;align-items:center;width:100%;border:0;background:none;color:var(--side-ink);font:inherit;text-align:left;cursor:pointer;border-radius:8px}
.nn1{font-size:13.5px;padding:7px 10px;font-weight:500}.nn1 span{flex:1}
.nn1:hover,.nn2:hover{background:rgba(255,255,255,.05)}
.nn1.cur{color:#fff}
.nn2l{margin:0 0 4px 12px}
.nn2{font-size:13px;padding:6px 10px;color:var(--side-mute)}
.nn2.on{background:rgba(18,163,131,.18);color:#fff}
/* ფაილები */
.kfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kfile{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kfile img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block}
.kfi{display:grid;place-items:center;height:110px;border-radius:6px;background:var(--sunk);text-decoration:none;color:var(--accent);font-size:15px}
.kfn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{padding:3px 8px;font-size:12px}
/* Claude ასისტენტი */
.aifab{position:fixed;right:20px;bottom:20px;z-index:60;border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(135deg,#0e7c66,#12a383);color:#fff;font:inherit;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(14,124,102,.35);cursor:pointer;display:flex;gap:8px;align-items:center}
.aifab span{font-size:17px}
.aibox{position:fixed;right:20px;bottom:20px;z-index:60;width:min(440px,calc(100vw - 24px));height:min(640px,calc(100vh - 40px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(15,27,45,.28);display:flex;flex-direction:column;overflow:hidden}
.aihead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#0c1f1b,#0e7c66);color:#fff}
.aihead .muted{color:#cfe3dd!important}.aihead .ib{background:rgba(255,255,255,.12);color:#fff;border:0}
.aibody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f6f8fb}
.aim{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.aim.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.aim.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.aim .kt{font-size:12.5px;margin:6px 0}.aim .kt th{position:static}
.aibusy{color:var(--muted);font-style:italic}
.aitools{margin-top:6px;font-size:11px;color:var(--muted)}
.aihello{color:var(--ink2);font-size:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}

<body>
<div class="wrap"><main id="app"><div class="empty"><b>იტვირთება…</b>მონაცემები მოდის ცხრილიდან.</div></main></div>
<div id="lb" class="lb" hidden><button class="lbx" data-lb="x" aria-label="დახურვა">✕</button><div class="lbz"><button data-lb="zi" aria-label="გადიდება">＋</button><button data-lb="zo" aria-label="დაპატარავება">－</button><button data-lb="z1" id="lbzr" aria-label="საწყისი ზომა" hidden>⤢</button></div><button class="lbn lbp" data-lb="p" aria-label="წინა">‹</button><img id="lbimg" alt="ფოტო"><button class="lbn lbnx" data-lb="n" aria-label="შემდეგი">›</button>
<div class="lbbar"><span id="lbc"></span><button class="lbsh" data-lb="sh">↗ გაზიარება</button><button data-lb="sha" id="lbsha">↗ ყველა ფოტო</button><a id="lbwa" target="_blank" rel="noopener">WhatsApp</a><a id="lbvb">Viber</a><a id="lbop" target="_blank" rel="noopener">⬇ ჩამოტვირთვა</a><button data-lb="cp">🔗 ბმული</button></div></div>
<div id="toast" class="toast" hidden></div>

<script>
const SL="/";const IMG="image"+SL+"*";const HTTPS="https:"+SL+SL;
const XLSX_URL=HTTPS+"cdnjs.cloudflare.com"+SL+"ajax"+SL+"libs"+SL+"xlsx"+SL+"0.18.5"+SL+"xlsx.full.min.js";
const KINDS=["პლანოგრამა","ფასმაჩვენებელი","შეკვეთა","POSM / აქცია","სხვა"];
const NOPHOTO=["შეკვეთა","შეხსენება"];
const MONTHS=["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი","ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];
const WDAYS=["კვირა","ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი"];
let D={agents:[],tasks:[],reports:[],objects:[],promos:[],orderDates:[],today:""};
const S={who:null,pin:null,apin:null,login:null,chatText:"",chatPh:[],chatSeenN:0,tab:"today",atab:"send",loaded:false,busy:{},d:{},open:null,del:null,agq:"",
  cbOpen:null,cbq:{},rf:{ag:"",date:"",net:"",q:"",n:30},sf:{net:"",q:"",n:20},asv:"new",pf:{net:""},
  q:{title:"",agent:"",store:"",kind:KINDS[0],due:"today",dueDate:"",details:"",ref:[],more:false},
  fl:{s:"",st:"active",ag:"",ob:"",kd:""},
  af:{task:null,store:"",note:"",photos:[]},
  ord:{date:"",rows:null,loading:false,q:"",open:{},netOpen:{},catOpen:{}},
  mo:{date:"",rows:null,loading:false,open:null,net:"",ag:"",q:""},
  imp:null,pimp:null,np:{network:"",product:"",barcode:"",regular:"",price:"",from:"",to:""}};
const CB={};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const API="https:"+"/"+"/bwldyaqpntcslmrywwau.supabase.co/functions/v1/api";
const run=(fn,...a)=>fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({fn,args:a})}).then(r=>r.json(),()=>{throw new Error("NetworkError: კავშირი ვერ შედგა")}).then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||"შეცდომა");return j.r});
const auth=()=>S.who==="__m"?{mgr:S.pin}:{who:S.who,pin:S.apin};
const ME=()=>S.who==="__m"?"მენეჯერი":S.who;
const th=(id,w)=>String(id).startsWith("local:")?(ls.get("mg.img."+id)||""):/^https?:/.test(String(id))?String(id):HTTPS+"drive.google.com"+SL+"thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(w||400);
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
const errMsg=e=>(e&&e.message?e.message:String(e)).replace(/^Exception: /,"");
const pad=n=>String(n).padStart(2,"0");
const norm=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function addDays(iso,n){const[y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
const fmtDate=s=>{if(!s)return"—";const p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s};
const fmtShort=s=>{if(!s)return"";const p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]:s};
const money=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const qtyf=n=>{const v=Math.round((Number(n)||0)*100)/100;return String(v)};
const active=t=>t.status==="ღია"||t.status==="დაბრუნებული";
const isLate=t=>active(t)&&t.due&&t.due<D.today;
const isToday=t=>active(t)&&t.due===D.today;
const initials=n=>String(n).split(" ").map(x=>x[0]||"").join("").slice(0,2);
function warn(t){if(!active(t)||!t.due)return"";if(t.due<D.today)return`<span class="pill w-late">ვადაგადაცილებული</span>`;if(t.due===D.today)return`<span class="pill w-soon">დღეს იწურება</span>`;if(t.due===addDays(D.today,1))return`<span class="pill w-soon">ხვალ</span>`;return""}
const pill=t=>`<span class="pill s-${esc(t.status)}">${t.status==="შესრულებული"?"შესამოწმებელი":esc(t.status)}</span>`;
function normPhone(v){let d=String(v||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.length===9&&d[0]==="5")d="995"+d;return d.length>=11?d:""}
function contact(name,text){const a=D.agents.find(x=>x.name===name);const p=a&&normPhone(a.phone);if(!p)return`<span class="small muted">ტელეფონი ცხრილში არ წერია</span>`;
  const q=text?"?text="+encodeURIComponent(text):"";
  return `<div class="row"><a class="btn wa" href="${HTTPS}wa.me${SL}${p}${q}">WhatsApp</a><a class="btn vb" href="viber:${SL}${SL}chat?number=%2B${p}${text?"&draft="+encodeURIComponent(text):""}">Viber</a><span class="mono muted">+${p}</span></div>`}
const msg=t=>["დავალება: "+t.title,t.store?"ობიექტი: "+t.store:"",t.due?"ვადა: "+fmtDate(t.due):"",t.details||"",t.status==="დაბრუნებული"&&t.managerNote?"გასასწორებელი: "+t.managerNote:""].filter(Boolean).join("\n");
const thumbs=(ids,rm,key)=>ids.map((id,i)=>`<span class="thumb"><img src="${th(id)}" alt="ფოტო" loading="lazy" data-a="zoom" data-id="${esc(id)}">${rm?`<button class="x" data-a="${rm}" data-k="${esc(key||"")}" data-i="${i}" aria-label="მოშორება">×</button>`:""}</span>`).join("");
const addBtn=(kind,key,label)=>`<label class="addph">${S.busy[key]?`იტვირთება<br>${S.busy[key]}…`:`<b>+</b>${label||"ფოტო"}`}<input type="file" accept="${IMG}" multiple data-up="${kind}" data-k="${esc(key)}"></label>`;
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`;

function agentOf(raw){const n=norm(raw);if(!n)return"";const a=D.agents.find(x=>norm(x.name)===n||(x.aliases||[]).indexOf(n)>=0);return a?a.name:""}
function tdays(o,who){const T=D.tours||{};if(o.merch&&agentOf(o.merch)===who&&agentOf(o.agent)!==who)return T["მ|"+o.name]||[];return T[o.name]||[]}
function myObjects(name){return D.objects.filter(o=>agentOf(o.agent)===name||(o.merch&&agentOf(o.merch)===name))}
const roleOf=name=>{const a=D.agents.find(x=>x.name===name);return a&&a.role==='merch'?'merch':'agent'};
const roleLabel=r=>r==='merch'?'მერჩენდაიზერი':'აგენტი';
function myNetworks(name){const s={};myObjects(name).forEach(o=>{if(o.network)s[norm(o.network)]=1});return s}
function promoNow(p){return(!p.from||p.from<=D.today)&&(!p.to||p.to>=D.today)}
function promoSoon(p){return p.from&&p.from>D.today&&p.from<=addDays(D.today,7)}
function promosFor(name,all){const nets=myNetworks(name);const has=Object.keys(nets).length>0;return D.promos.filter(p=>all||!has||!p.network||nets[norm(p.network)])}

function cb(key,o){
  CB[key]=o;
  const val=o.label?o.label(o.get()):o.get();
  return `<div class="cb"><input type="text" id="cb-${key}" data-cb="${key}" value="${esc(val)}" placeholder="${esc(o.ph||"")}" autocomplete="off" enterkeyhint="search"><div class="cbl" id="cbl-${key}" hidden></div></div>`}
function cbQuery(q){return norm(q).replace(/^[#№]+/,"").trim()}
function cbMatch(it,q){if(!q)return 1;const t=norm(it.l+" "+(it.sub||""));if(!t.includes(q))return 0;
  if(/^\d+$/.test(q)){if(new RegExp("#"+q+"([^0-9]|$)").test(t))return 4;if(new RegExp("(^|[^0-9])"+q+"([^0-9]|$)").test(t))return 3}return t.startsWith(q)?2:1}
function cbList(key){
  const o=CB[key];if(!o)return[];const q=cbQuery(S.cbq[key]||"");const out=[];
  o.items().forEach(g=>{const its=g.items.map(it=>[cbMatch(it,q),it]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);if(its.length)out.push({title:g.title,items:its})});
  return out}
function cbItems(key){
  const o=CB[key];if(!o)return"";const q=cbQuery(S.cbq[key]||"");
  let h="",shown=0;
  cbList(key).forEach(g=>{if(shown>=120)return;if(g.title)h+=`<div class="sec">${esc(g.title)} (${g.items.length})</div>`;
    g.items.slice(0,120-shown).forEach(it=>{shown++;h+=`<button type="button" data-cbpick="${key}" data-v="${esc(it.v)}">${esc(it.l)}${it.sub?`<span>${esc(it.sub)}</span>`:""}</button>`})});
  if(!shown)h=`<div class="none">${o.free&&q?"სიაში არ არის — ჩაიწერება როგორც ახალი":"ვერ მოიძებნა"}</div>`;
  return h}
function cbOpenIt(key){const l=document.getElementById("cbl-"+key);if(!l)return;S.cbOpen=key;l.innerHTML=cbItems(key);l.hidden=false;l.scrollTop=0}
function cbRefresh(key){cbOpenIt(key)}
function cbClose(apply){const key=S.cbOpen;if(!key)return;S.cbOpen=null;const o=CB[key];const l=document.getElementById("cbl-"+key);if(l)l.hidden=true;
  const typed=S.cbq[key];
  const all=o&&!o.free&&apply&&typed&&cbQuery(typed)?[].concat(...cbList(key).map(g=>g.items)):[];
  S.cbq[key]=null;
  if(all.length===1){o.set(all[0].v);render();return}
  const inp=document.getElementById("cb-"+key);if(inp&&o)inp.value=o.label?o.label(o.get()):o.get()}
function cbPick(key,v){const o=CB[key];S.cbOpen=null;S.cbq[key]=null;if(o)o.set(v);const ae=document.activeElement;if(ae&&ae.blur)ae.blur();render()}

async function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.72))};img.onerror=()=>res(r.result);img.src=r.result};r.readAsDataURL(file)})}
const isNet=e=>!navigator.onLine||/network|connection|failed to fetch|timed? ?out|http 0|ქსელ/i.test(errMsg(e));
function keepLocal(data){const id="local:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{localStorage.setItem("mg.img."+id,data);return id}catch(e){toast("ტელეფონში ადგილი აღარ არის ფოტოსთვის — დაელოდე ინტერნეტს");return null}}
async function uploadMany(files,key){const out=new Array(files.length);let next=0,offline=false;S.busy[key]=(S.busy[key]||0)+files.length;render();
  const worker=async()=>{while(next<files.length){const i=next++;let data=null;
    try{data=await shrink(files[i]);out[i]=(offline||!navigator.onLine)?keepLocal(data):await run("uploadPhoto",data,auth())}
    catch(e){if(data&&isNet(e)){offline=true;out[i]=keepLocal(data)}else toast("ფოტო ვერ აიტვირთა: "+errMsg(e))}
    finally{S.busy[key]--;render()}}};
  await Promise.all([worker(),worker(),worker()]);
  if(offline||out.some(x=>x&&String(x).startsWith("local:")))toast("ინტერნეტი არ არის — ფოტო შენახულია ტელეფონში და გაიგზავნება მოგვიანებით");
  render();return out.filter(Boolean)}
const qGet=()=>{try{return JSON.parse(localStorage.getItem("mg.q")||"[]")}catch(e){return[]}};
const qSet=q=>{try{localStorage.setItem("mg.q",JSON.stringify(q))}catch(e){}};
function qAdd(fn,args){const q=qGet();q.push({fn,args,who:S.who,time:Date.now()});qSet(q)}
async function flushQ(manual){if(S.qBusy)return;let q=qGet().filter(x=>x.who===S.who);if(!q.length||!S.who||S.who==="__m")return;
  if(!navigator.onLine){if(manual)toast("ინტერნეტი ჯერ არ არის");return}
  S.qBusy=true;let sent=0;
  try{for(const it of q){
    const fix=async v=>{if(Array.isArray(v))return Promise.all(v.map(fix));if(typeof v==="string"&&v.startsWith("local:")){const d=ls.get("mg.img."+v);return d?await run("uploadPhoto",d,auth()):null}return v};
    let args;try{args=await fix(it.args);args=args.map(a=>Array.isArray(a)?a.filter(Boolean):a)}catch(e){if(isNet(e))break;throw e}
    try{const res=await run("call",it.fn,args,auth());setData(res.data)}
    catch(e){if(isNet(e)||/შედი თავიდან/.test(errMsg(e)))break;toast("ვერ გაიგზავნა: "+errMsg(e))}
    JSON.stringify(it.args).replace(/local:[a-z0-9]+/g,id=>{try{localStorage.removeItem("mg.img."+id)}catch(x){}});
    qSet(qGet().filter(x=>x.time!==it.time));sent++}}
  catch(e){toast(errMsg(e))}
  finally{S.qBusy=false;if(sent)toast("✓ შენახული "+sent+" გაგზავნა გაიგზავნა");render()}}
window.addEventListener("online",()=>setTimeout(()=>flushQ(),1500));
setInterval(()=>flushQ(),30000);
function qBanner(){const n=qGet().filter(x=>x.who===S.who).length;return n?`<button class="banner hotb" data-a="qflush"><span>⏳ ${n} გაგზავნა ელოდება ინტერნეტს${S.qBusy?" — იგზავნება…":""}</span><span>ცდა ›</span></button>`:""}
function setData(d){if(!d.chat)d.chat=D.chat||[];const li=(x)=>x&&x.importLog&&x.importLog[0]?x.importLog[0].time:"";if(S.loaded&&li(d)!==li(D)){S.ord.rows=null;S.mo.rows=null}D=d;S.loaded=true;try{localStorage.setItem("mg.data",JSON.stringify(d))}catch(e){}}
async function load(silent){try{setData(await run("getData"));render()}catch(e){if(!silent&&!S.loaded)$("#app").innerHTML=`<div class="empty"><b>ცხრილთან კავშირი ვერ შედგა</b>${esc(errMsg(e))}</div>`;else if(!silent)toast(errMsg(e))}}

function render(){
  const ae=document.activeElement,fid=ae&&ae.id;let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}

function objNetMap(){if(S._onm&&S._onm.d===D.objects)return S._onm.m;const m={};D.objects.forEach(o=>{m[norm(o.name)]=o.network||""});S._onm={d:D.objects,m};return m}
function netOf(store){if(!store)return"";const m=objNetMap();const k=norm(store);if(m[k]!=null)return m[k];

async function kFiles(files) {
