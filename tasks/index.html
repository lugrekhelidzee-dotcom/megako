<style>
/* Layout: one working column — date + KPI strip, sticky view tabs, quick-add, then the active view. Ledger-like, navy ink on cool paper. */
:root{

  --r:10px; --wa:#1E9E52; --vb:#6E58E8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#141B30; --sunk:#1B2440; --ink:#E5EAF7; --muted:#97A3C2; --line:#28334F;
  --accent:#9DB2FF; --accent-2:#B7C7FF; --on-accent:#0B1020;
  --red:#FF8A80; --red-bg:#3A1B1E; --amber:#F2B34C; --amber-bg:#352814; --green:#5FD3A2; --green-bg:#12302A;
  --blue:#8DB1FF; --blue-bg:#18264A; --grey:#9AA3BA; --grey-bg:#222A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B30; --sunk:#1B2440; --ink:#E5EAF7; --muted:#97A3C2; --line:#28334F;
  --accent:#9DB2FF; --accent-2:#B7C7FF; --on-accent:#0B1020;
  --red:#FF8A80; --red-bg:#3A1B1E; --amber:#F2B34C; --amber-bg:#352814; --green:#5FD3A2; --green-bg:#12302A;
  --blue:#8DB1FF; --blue-bg:#18264A; --grey:#9AA3BA; --grey-bg:#222A40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-top:22px}
.top h1{font-family:var(--f-display);font-size:26px;line-height:1.2;margin:0;letter-spacing:.2px;text-wrap:balance}
.date{color:var(--muted);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}

.kpi strong{font-family:var(--f-num);font-size:22px;font-weight:500;line-height:1.2}
.kpi.click:hover{background:var(--sunk)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

.sec h2.red{color:var(--red)}
.list{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r)}

/* task card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;gap:10px;padding:10px 12px 10px 14px;align-items:flex-start}

.card.p-high{--pri:var(--red)} .card.p-med{--pri:var(--amber)} .card.p-low{--pri:var(--green)}
.card.is-done{opacity:.62}

.card.drag{opacity:.4}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);margin-top:0;display:grid;place-items:center;padding:0}
.chk:not(.on) svg{opacity:.35}
.chk:not(.on) svg{stroke:var(--muted)}
@media (max-width:520px){.chk{width:28px;height:28px}.card{flex-wrap:wrap}.card .acts{width:100%;justify-content:flex-end;padding-left:38px}}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green)}
.chk svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk.on svg,.chk:hover svg{opacity:1}
.chk:hover:not(.on) svg{stroke:var(--green)}
.body{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}

.s-overdue{background:var(--red-bg);color:var(--red)} .s-today{background:var(--amber-bg);color:var(--amber)}

/* table */

  async function call(op, a) {
    let r; try { r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ args: [getPin(), op, a || {}] }) }); }
    catch (e) { const x = new Error("network"); x.code = "unavailable"; throw x; }

  }
  let cache = null; const listeners = [];

    catch (e) { listeners.forEach(l => l.err && l.err(e)); throw e; }

    };

        listeners.push(l); if (cache) l.fire(); return () => {};
      },
    };
    return o;
  }
  const db = { doc: docRef, collection: coll };
  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const STATUS = { todo:"შესასრულებელი", doing:"მიმდინარე", done:"შესრულებული", postponed:"გადავადებული" };

const PRI = { high:"მაღალი", med:"საშუალო", low:"დაბალი" };
const PRI_RANK = { high:0, med:1, low:2 };
const RECUR = { "":"არ მეორდება", daily:"ყოველდღე", weekdays:"სამუშაო დღეებში (ორშ–პარ)", weekly:"ყოველ კვირა", monthly:"ყოველ თვე" };
const MONTHS = ["იან","თებ","მარ","აპრ","მაი","ივნ","ივლ","აგვ","სექ","ოქტ","ნოე","დეკ"];
const MONTHS_FULL = ["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი","ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];
const WD = ["კვირა","ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი","შაბათი"];
const WD_S = ["კვი","ორშ","სამ","ოთხ","ხუთ","პარ","შაბ"];
const DEFAULT_LISTS = {
  categories:["სამუშაო","პირადი","ფინანსები","განათლება","ჯანმრთელობა","ოჯახი","სხვა"],
  objects:["გუნდი","მეგაკო","ორი ნაბიჯი","მაგნიტი","კალათა","ჯიბე","ექსპრეს ქსელი","ზღაპარი","მადაგონი","სხვა"]
};
const VIEWS = [["today","დღეს"],["week","კვირა"],["board","დაფა"],["all","ყველა"],["done","შესრულებული"],["stats","ანალიტიკა"],["settings","პარამეტრები"]];

/* ---------- state ---------- */
const S = {
  tasks: new Map(), lists: {...DEFAULT_LISTS}, contacts: [], assets: null, loaded:false, db:null, downloads:null,
  view: "today", quickDue: 0,
  f: { q:"", status:"active", obj:"", cat:"", pri:"", sort:"due" },
  d: { q:"", obj:"", period:"30" },
};
try { const v = localStorage.getItem("tm.view"); if (VIEWS.some(x=>x[0]===v)) S.view = v; } catch(e){}
try { const f = JSON.parse(localStorage.getItem("tm.f")||"null"); if (f) Object.assign(S.f, f, {q:""}); } catch(e){}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ms = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const iso = t => new Date(t).toISOString().slice(0,10);
const addDays = (s,n) => iso(ms(s) + n*864e5);
const diff = s => Math.round((ms(s) - ms(todayStr()))/864e5);
const wday = s => new Date(ms(s)).getUTCDay();
const fmt = s => s ? `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}` : "—";
const fmtShort = s => `${+s.slice(8,10)} ${MONTHS[+s.slice(5,7)-1]}`;
function stepRecur(s, r){
  if (r==="daily") return addDays(s,1);
  if (r==="weekly") return addDays(s,7);
  if (r==="weekdays"){ let n = addDays(s,1); while ([0,6].includes(wday(n))) n = addDays(n,1); return n; }
  if (r==="monthly"){ const [y,m,d] = s.split("-").map(Number); const ny = m===12?y+1:y, nm = m===12?1:m+1;
    const last = new Date(Date.UTC(ny,nm,0)).getUTCDate(); return `${ny}-${pad(nm)}-${pad(Math.min(d,last))}`; }
  return null;
}
function nextOccurrence(t){
  const today = todayStr(); let n = stepRecur(t.due || today, t.recur);
  while (n && n < today) n = stepRecur(n, t.recur);
  return n;
}

/* ---------- derived ---------- */
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
function dueState(t){
  if (t.status==="done") return "done";
  if (t.status==="postponed") return "postponed";
  if (!t.due) return "nodue";
  const d = diff(t.due), late = d===0 && t.time && t.time < nowHM();
  return d<0 || late ? "overdue" : d===0 ? "today" : d<=2 ? "soon" : "ok";
}
function dueLabel(t){
  const st = dueState(t), d = t.due ? diff(t.due) : 0;
  switch(st){
    case "done": return "შესრულებულია";
    case "postponed": return "გადავადებულია";
    case "nodue": return "ვადის გარეშე";
    case "overdue": return d<0 ? `ვადაგადაცილებულია · ${-d} დღე` : `ვადა გავიდა ${t.time}-ზე`;
    case "today": return t.time ? `დღეს ${t.time}` : "დღეს იწურება";
    case "soon": return (d===1 ? "ხვალ" : `${d} დღეში`) + (t.time ? ` ${t.time}` : "");
    default: return `${fmtShort(t.due)}${t.time?` ${t.time}`:""} · ${d} დღე`;
  }
}
const all = () => [...S.tasks.values()];
const active = t => t.status!=="done";
const dueKey = t => (t.due||"9999") + (t.time||"99:99");
function cmpPriDue(a,b){
  return (PRI_RANK[a.pri]??1)-(PRI_RANK[b.pri]??1) || dueKey(a).localeCompare(dueKey(b)) || (a.created||0)-(b.created||0);
}
function cmpDuePri(a,b){
  return dueKey(a).localeCompare(dueKey(b)) || (PRI_RANK[a.pri]??1)-(PRI_RANK[b.pri]??1);
}
const subsOf = t => Array.isArray(t.subs) ? t.subs : [];
const subsRatio = t => { const L = subsOf(t); return L.length ? L.filter(x=>x.d).length / L.length : null; };
const progressOf = t => t.status==="done" ? 1 : (subsRatio(t) ?? (+t.progress||0));
function stats(list){
  const s = { total:list.length, todo:0, doing:0, done:0, postponed:0, overdue:0, today:0, soon:0, prog:0 };
  for (const t of list){ s[t.status] = (s[t.status]||0)+1; const d = dueState(t); if (d==="overdue") s.overdue++; if (d==="today") s.today++; if (d==="soon") s.soon++; s.prog += progressOf(t); }
  s.prog = s.total ? s.prog/s.total : 0; s.rate = s.total ? s.done/s.total : 0; return s;
}

/* ---------- helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt = (v, label, sel) => `<option value="${esc(v)}"${sel?" selected":""}>${esc(label)}</option>`;
const ICON_CHECK = `<svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>`;
const ICON_RECUR = `<svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 0 1 9.6-3.7M13.5 8a5.5 5.5 0 0 1-9.6 3.7"/><path d="M12.5 1.5v3h-3M3.5 14.5v-3h3"/></svg>`;
const newId = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- smart quick-add parser ---------- */
const WD_STEMS = [["ორშაბათ",1],["სამშაბათ",2],["ოთხშაბათ",3],["ხუთშაბათ",4],["პარასკევ",5],["შაბათ",6]];
function parseQuick(raw){
  let s = " " + raw + " ";
  const r = {}, today = todayStr();
  const cut = (re, fn) => { const m = s.match(re); if (!m) return false; if (fn(m) === false) return false; s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); return true; };

    const low = s.toLowerCase();
    for (const o of [...list].sort((a,b)=>b.length-a.length)){
      const i = low.indexOf(sym + o.toLowerCase());
      if (i >= 0){ r[key] = o; s = s.slice(0,i) + " " + s.slice(i + 1 + o.length); return; }
    }
    cut(new RegExp("\\s\\" + sym + "(\\S+)"), m => { const tok = m[1].toLowerCase(); const o = list.find(x => x.toLowerCase().startsWith(tok)); if (!o) return false; r[key] = o; });
  };

  pick("#", S.lists.categories, "cat");
  if (!cut(new RegExp("\\s(!!+|!მაღალი)" + B), () => { r.pri = "high"; }))

  cut(new RegExp("\\sსამუშაო დღეებში" + B), () => { r.recur = "weekdays"; }) ||
  cut(new RegExp("\\s(ყოველ ?კვირა|ყოველკვირეულად)" + B), () => { r.recur = "weekly"; }) ||
  cut(new RegExp("\\s(ყოველ ?თვე|ყოველთვიურად)" + B), () => { r.recur = "monthly"; });
  cut(/\s([01]?\d|2[0-3]):([0-5]\d)(?:-?(?:ზე|სთ|საათზე))?(?=[\s,.;!?-]|$)/, m => { r.time = `${pad(+m[1])}:${m[2]}`; }) ||
  cut(new RegExp("\\s([01]?\\d|2[0-3])(?: საათ(?:ზე|ისთვის)?|-ზე| ?-?სთ(?:-?ზე)?)" + B), m => { r.time = `${pad(+m[1])}:00`; });
  cut(/\s(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?:-?(?:ზე|მდე|ში))?(?=[\s,;!?-]|$)/, m => {
    const d = +m[1], mo = +m[2]; if (d<1 || d>31 || mo<1 || mo>12) return false;
    let y = m[3] ? +m[3] : +today.slice(0,4); if (y < 100) y += 2000;
    r.due = `${y}-${pad(mo)}-${pad(d)}`;
  }) ||
  cut(new RegExp("\\sდღეს" + B), () => { r.due = today; }) ||

    const st = t0 + r*1.1 + i*0.22, o = c.createOscillator(), g = c.createGain();

  }
}

function applyOutcome(kind){
  if (!outState) return;
  const t = S.tasks.get(outState.id); if (!t) return closeModal();
  const text = $("#o-text").value.trim(), d = $("#o-date").value, tm = $("#o-time").value;
  const prev = {...t};
  if (kind === "note" && !text && !outState.files.length){ $("#o-text").focus(); toast("ჩაწერეთ კომენტარი ან მიამაგრეთ ფოტო"); return; }
  const added = outState.files.slice();
  if (kind === "note" && added.length && !text){ /* a photo alone is a valid note */ }
  const entry = { at: nowStamp(), kind, text };
  if (added.length) entry.files = added.map(f => f.id);
  if (kind === "moved"){ entry.from = t.due ? `${t.due}${t.time?" "+t.time:""}` : ""; entry.to = `${d}${tm?" "+tm:""}`; }
  const log = [...logOf(t), entry];
  const files = [...filesOf(t), ...added];
  closeModal();
  if (kind === "done"){ setStatus({...t, log, files}, "done"); return; }
  if (kind === "moved"){
    const upd = {...t, log, files, due: d, time: tm || t.time || "", status: t.status === "postponed" || t.status === "done" ? "todo" : t.status, updated: Date.now()};
    if (upd.start && upd.start > d) upd.start = d;
    saveTask(upd);
    toast(`გადაიწია: ${diff(d)===0?"დღეს":diff(d)===1?"ხვალ":fmtShort(d)}${upd.time?` ${upd.time}`:""}`, () => saveTask(prev));
    return;
  }
  saveTask({...t, log, files, updated: Date.now()});
  toast(added.length && !text ? "ფაილი მიმაგრდა" : "კომენტარი შენახულია", () => saveTask(prev));
}

function normPhone(p){
  let d = String(p||"").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 9 && d[0] === "5") d = "995" + d;          // Georgian mobile without country code
  if (d.length === 10 && d.startsWith("05")) d = "995" + d.slice(1);
  return d;
}
const prettyPhone = p => { const d = normPhone(p); return d.startsWith("995") && d.length===12 ? `+995 ${d.slice(3,6)} ${d.slice(6,8)} ${d.slice(8,10)} ${d.slice(10)}` : (d ? "+"+d : ""); };

  return L.join("\n");

/* ---------- persistence: local copy + outbox, then the server ---------- */
const LS = { tasks:"tm.tasks.v2", lists:"tm.lists.v2", outbox:"tm.outbox.v2", contacts:"tm.contacts.v2" };
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
// outbox: { [docKey]: {op:"set", body} | {op:"del"} }  — changes not yet confirmed by the server
let outbox = lsGet(LS.outbox, {});
const sync = { state:"local", err:"" };
function cacheLocal(){
  lsSet(LS.tasks, [...S.tasks.values()]);
  lsSet(LS.lists, S.lists);
  lsSet(LS.contacts, S.contacts);
  lsSet(LS.outbox, outbox);
}
function setSync(state, err=""){
  sync.state = state; sync.err = err;
  const el = $("#sync"); if (!el) return;
  const pending = Object.keys(outbox).length;
  el.style.color = state==="error" ? "var(--red)" : "";
  el.textContent = state==="saved" ? (pending ? "ინახება…" : "✓ შენახულია")
    : state==="saving" ? "ინახება…"
    : state==="error" ? `შენახვის შეცდომა${err?` (${err})`:""} · ${pending} ცვლილება ელოდება`
    : "შენახულია ამ მოწყობილობაზე";
}
function errText(e){
  if (e && e.code==="quota_exceeded") return "მეხსიერება სავსეა — წაშალეთ ძველი დავალებები.";
  if (e && e.code==="invalid_argument") return "სერვერმა ცვლილება არ მიიღო — შენახულია ამ მოწყობილობაზე.";
  return "სერვერთან კავშირი ვერ მოხერხდა — ცვლილება შენახულია ამ მოწყობილობაზე და მოგვიანებით გაიგზავნება.";
}
let flushing = false, flushAgain = false, retryTimer = null;
async function flush(){
  if (!S.db) { setSync("local"); return; }
  if (flushing){ flushAgain = true; return; }
  flushing = true; setSync("saving");
  let failed = null;
  for (const key of Object.keys(outbox)){
    const entry = outbox[key];
    try {
      const ref = key === "config" ? S.db.doc("config/lists") : key === "contacts" ? S.db.doc("config/contacts") : S.db.collection("tasks").doc(key);
      if (entry.op === "del") await ref.delete(); else await ref.set(entry.body);
      if (outbox[key] === entry) delete outbox[key];      // keep it if it changed meanwhile
    } catch(e){ failed = e; break; }
  }
  lsSet(LS.outbox, outbox);
  flushing = false;
  if (failed){
    setSync("error", failed.code || "");
    toast(errText(failed));
    clearTimeout(retryTimer);
    if (failed.code !== "invalid_argument" && failed.code !== "quota_exceeded") retryTimer = setTimeout(flush, 15000);
    return;
  }
  if (flushAgain){ flushAgain = false; return flush(); }
  setSync("saved");
}
function saveTask(t){
  const body = {...t}; delete body.id;
  S.tasks.set(t.id, {...t});
  outbox[t.id] = { op:"set", body };
  cacheLocal(); render(); return flush();
}
function removeTask(id){
  S.tasks.delete(id);
  outbox[id] = { op:"del" };
  cacheLocal(); render(); return flush();
}
function saveContacts(){
  outbox.contacts = { op:"set", body:{ list: S.contacts.map(c => ({...c})) } };
  cacheLocal(); render(); flush();
}
function saveLists(){
  outbox.config = { op:"set", body:{ categories:[...S.lists.categories], objects:[...S.lists.objects] } };
  cacheLocal(); render(); flush();
}
// server snapshot + changes still waiting in the outbox = what the person should see
function overlay(serverMap){
  for (const [key, e] of Object.entries(outbox)){
    if (key === "config" || key === "contacts") continue;
    if (e.op === "del") serverMap.delete(key); else serverMap.set(key, {...e.body, id:key});
  }
  return serverMap;
}

/* ---------- task actions ---------- */
function setStatus(t, status, opts={}){
  const prev = {...t};
  const upd = {...t, status, updated: Date.now()};
  let spawned = null;
  if (status==="done"){
    upd.doneAt = todayStr(); upd.progress = 1;
    if (t.recur && !t.spawned){
      const n = nextOccurrence(t);
      if (n){ spawned = { ...t, id:newId(), status:"todo", progress:0, start:n, due:n, doneAt:"", spawned:false, subs: subsOf(t).map(x=>({...x, d:false})), created:Date.now(), updated:Date.now() };
        upd.spawned = true; }
    }
  } else {
    upd.doneAt = "";
    if (status==="doing" && !(+t.progress)) upd.progress = 0.1;
  }
  saveTask(upd);
  if (spawned) saveTask(spawned);
  if (!opts.silent){
    const msg = status==="done" ? (spawned ? `შესრულდა · შემდეგი: ${fmtShort(spawned.due)}` : "შესრულებულია") : `სტატუსი: ${STATUS[status]}`;
    toast(msg, () => { saveTask(prev); if (spawned) removeTask(spawned.id); });
  }
}

/* ---------- card ---------- */
function card(t, opts={}){

  const subChip = (subs.length ? `<span class="num">☑ ${subs.filter(x=>x.d).length}/${subs.length}</span>` : "")
    + (filesOf(t).length ? `<span class="num">📎 ${filesOf(t).length}</span>` : "");
  const imgs = filesOf(t).filter(isImg).slice(-4);
  const docs = filesOf(t).filter(f => !isImg(f));
  const fileRow = (imgs.length || docs.length) && !opts.compact ? `<div class="cardfiles">${imgs.map(f=>`<div class="fthumb"><img src="${blobUrl(f.id)}" alt="${esc(f.name)}" data-view-img="${esc(f.id)}" loading="lazy"></div>`).join("")}${docs.map(f=>`<button class="docchip" data-open-file="${esc(f.id)}" title="${esc(f.name)}"><b>${esc(docIcon(f))}</b><span>${esc(f.name)}</span></button>`).join("")}</div>` : "";
  const subList = subs.length && !opts.compact && t.status!=="done"
    ? `<ul class="subs">${subs.map((x,i)=>`<li class="${x.d?"d":""}"><button class="sbox${x.d?" on":""}" data-sub="${i}" aria-label="${x.d?"მოხსნა":"მონიშვნა"}: ${esc(x.t)}">${ICON_CHECK}</button><span>${esc(x.t)}</span></li>`).join("")}</ul>` : "";
  const acts = opts.noActs ? "" : (t.status==="todo" ? `<button class="mini" data-act="doing">დაწყება</button>` : t.status==="postponed" ? `<button class="mini" data-act="todo">აღდგენა</button>` : "")
    + `<button class="mini" data-act="send" title="გაგზავნა WhatsApp / Viber">გაგზავნა</button>`
    + (t.due && t.status !== "done" ? `<a class="mini" href="${esc(gcalUrl(t))}" target="_blank" rel="noopener" title="Google Calendar-ში დამატება — ტელეფონი შეგახსენებთ">📅</a>` : "");
  const who = t.contact && contactById(t.contact);
  return `<article class="card p-${t.pri||"med"}${t.status==="done" && !opts.archive?" is-done":""}" data-id="${t.id}" ${opts.drag?'draggable="true"':""}>
    <button class="chk${t.status==="done"?" on":""}" data-act="toggle" aria-label="${t.status==="done"?"დაბრუნება":"შესრულება"}">${ICON_CHECK}</button>
    <div class="body" data-act="edit">
      <div class="ttl">${esc(t.title)}</div>
      <div class="meta">
        ${t.obj?`<span class="tag t-obj">${esc(t.obj)}</span>`:""}
        ${who?`<span class="tag t-who">${esc(who.name)}</span>`:""}
        <span class="tag s-${st}">${dueLabel(t)}</span>
        ${opts.showStatus && t.status!=="done" ? `<span class="tag st-${t.status}">${STATUS[t.status]}</span>`:""}
        ${t.cat?`<span>${esc(t.cat)}</span>`:""}
        ${t.recur?`<span class="recur" title="${RECUR[t.recur]}">${ICON_RECUR}${RECUR[t.recur].split(" ")[0]}</span>`:""}
        ${subChip}${prog}
      </div>
      ${t.note && !opts.compact ? `<div class="note">${esc(t.note)}</div>`:""}
      ${subList}
      ${fileRow}
      ${(() => { const last = logOf(t).filter(x => x.text).slice(-1)[0]; return last ? `<div class="lastlog">💬 ${esc(last.text)}<span class="when">${esc(stampShort(last.at))}</span></div>` : ""; })()}
    </div>
    ${acts?`<div class="acts">${acts}</div>`:""}
  </article>`;
}
const section = (title, list, opts={}) => `<section class="sec"><h2 class="${opts.cls||""}">${title} <span class="n">${list.length}</span></h2>
  <div class="list">${list.length ? list.map(t=>card(t,opts)).join("") : `<div class="empty">${opts.empty||"ცარიელია"}</div>`}</div></section>`;

/* ---------- views ---------- */
function vToday(){
  const L = all(), today = todayStr();
  const overdue = L.filter(t => dueState(t)==="overdue").sort(cmpPriDue);
  const due = L.filter(t => dueState(t)==="today").sort(cmpPriDue);
  const soon = L.filter(t => dueState(t)==="soon").sort(cmpDuePri);
  const shown = new Set([...overdue,...due,...soon].map(t=>t.id));
  const doing = L.filter(t => t.status==="doing" && !shown.has(t.id)).sort(cmpPriDue);
  const done = L.filter(t => t.status==="done" && t.doneAt===today);
  if (!S.loaded) return `<div class="empty">იტვირთება…</div>`;
  if (!L.length) return `<div class="empty">ჯერ დავალება არ გაქვთ. ჩაწერეთ პირველი ზემოთ ველში და დააჭირეთ Enter-ს.</div>`;
  return `<div class="daybar"><button class="btn" id="send-day">დღის სიის გაგზავნა</button></div>`
    + (overdue.length ? section("ვადაგადაცილებული", overdue, {cls:"red"}) : "")

function vWeek(){
  const today = todayStr(), L = all().filter(t => t.status!=="done" && t.status!=="postponed");
  const earlier = L.filter(t => t.due && t.due < today).sort(cmpPriDue);
  let html = `<div class="week">`;
  if (earlier.length) html += `<div class="col day past"><h3>ვადაგადაცილებული <span class="d">${earlier.length}</span></h3>${earlier.map(t=>card(t,{compact:true,noActs:true})).join("")}</div>`;
  const days = earlier.length ? 6 : 7;
  for (let i=0;i<days;i++){
    const d = addDays(today,i), items = L.filter(t => t.due===d).sort(cmpPriDue);
    const lbl = i===0 ? "დღეს" : i===1 ? "ხვალ" : WD[wday(d)];

  }
  const noDue = L.filter(t => !t.due);
  return html + `</div>` + (noDue.length ? `<div style="margin-top:22px">${section("ვადის გარეშე", noDue.sort(cmpPriDue), {compact:true})}</div>` : "")
    + `<p class="hint" style="margin-top:12px">გადაათრიეთ დავალება სხვა დღეზე, ვადა ავტომატურად შეიცვლება.</p>`;
}

function filtered(){
  const f = S.f, q = f.q.trim().toLowerCase();
  let L = all().filter(t => {
    if (f.status==="active" && t.status==="done") return false;
    if (f.status==="overdue" && dueState(t)!=="overdue") return false;
    if (STATUS[f.status] && t.status!==f.status) return false;
    if (f.obj && t.obj!==f.obj) return false;
    if (f.cat && t.cat!==f.cat) return false;
    if (f.pri && t.pri!==f.pri) return false;
    if (q && !(`${t.title} ${t.note} ${t.obj} ${t.cat}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const sorters = { due:cmpDuePri, pri:cmpPriDue, obj:(a,b)=>(a.obj||"").localeCompare(b.obj||"","ka")||cmpDuePri(a,b),
    status:(a,b)=>STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)||cmpDuePri(a,b), title:(a,b)=>a.title.localeCompare(b.title,"ka") };
  return L.sort(sorters[f.sort]||cmpDuePri);
}

      • საათიანი დავალება: დანიშნულ დროს პროგრამა ხმით გაგაფრთხილებთ (როცა ღიაა; ზედა კუთხეში 🔔 — ჩართვა/გამორთვა). ტელეფონზე საიმედო შეხსენებისთვის დააჭირეთ 📅 — დავალება Google Calendar-ში დაემატება.<br>
      • ფოტოს/ფაილის მიმაგრება — დავალების რედაქტირებაში ან „რა მოხდა?“ ფანჯარაში (+ ფოტო / ფაილი). ტელეფონზე შეგიძლიათ პირდაპირ კამერით გადაიღოთ.<br>
      • წრეზე დაჭერა ხსნის ფანჯარას „რა მოხდა?“ — ჩაწერეთ კომენტარი და აირჩიეთ: შესრულდა, გადატანა ან მხოლოდ კომენტარი. თუ ტექსტში თარიღი/საათი წერია („გადაიწია ხვალ 11:00-ზე“), დავალება თავისით გადაიტანება. დასახელებაზე დაჭერა — რედაქტირება და კომენტარების ისტორია.<br>
      • განმეორებადი დავალების შესრულებისას შემდეგი ავტომატურად ჩნდება მომდევნო თარიღზე.<br>
      • ობიექტის წაშლა სიიდან არსებულ დავალებებს არ ცვლის.<br>
      • კლავიშები: <span class="num">N</span> — ახალი დავალება, <span class="num">Esc</span> — ფანჯრის დახურვა.</p></div>`;
}

let usageTimer = null;
function refreshUsage(){
  if (!S.assets || S.view !== "settings") return;
  clearTimeout(usageTimer);
  usageTimer = setTimeout(async () => {
    try { const r = await S.assets.list(); const u = r.usage, el = $("#usage");
      if (el) el.textContent = `გამოყენებულია ${fmtSize(u.bytes)} / ${fmtSize(u.maxBytes)} · ${u.files} ფაილი (მაქს. ${u.maxFiles})`;
    } catch(e){ const el = $("#usage"); if (el) el.textContent = "საცავის მონაცემები ვერ ჩაიტვირთა."; }
  }, 300);
}

/* ---------- modal editor ---------- */
let modalTask = null;
function openEditor(t){
  const isNew = !t;
  const base = t || { id:newId(), title:$("#qa-title").value.trim(), cat:$("#qa-cat").value, obj:$("#qa-obj").value, pri:$("#qa-pri").value,

  modalTask = {...base};
  const objs = [...new Set([...S.lists.objects, base.obj].filter(Boolean))], cats = [...new Set([...S.lists.categories, base.cat].filter(Boolean))];
  $("#modal-root").innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
    <h2 id="m-h">${isNew?"ახალი დავალება":"დავალების რედაქტირება"}</h2>
    <form class="form" id="m-form">
      <label class="full">დასახელება<input class="inp" id="m-title" required value="${esc(base.title)}"></label>
      <label>ობიექტი / ქვეკატეგორია<select class="sel" id="m-obj">${opt("","—")}${objs.map(o=>opt(o,o,o===base.obj)).join("")}</select></label>
      <label>კატეგორია<select class="sel" id="m-cat">${cats.map(o=>opt(o,o,o===base.cat)).join("")}</select></label>
      <label>პრიორიტეტი<select class="sel" id="m-pri">${Object.entries(PRI).map(([k,l])=>opt(k,l,k===base.pri)).join("")}</select></label>
      <label>სტატუსი<select class="sel" id="m-status">${STATUS_ORDER.map(k=>opt(k,STATUS[k],k===base.status)).join("")}</select></label>
      <label>დაწყების თარიღი<input class="inp" type="date" id="m-start" value="${esc(base.start||"")}"></label>
      <label>შესრულების ვადა<input class="inp" type="date" id="m-due" value="${esc(base.due||"")}"></label>
      <label>საათი (არასავალდებულო)<input class="inp" type="time" id="m-time" value="${esc(base.time||"")}"></label>
      <label>აბონენტი (ვის ეხება)<select class="sel" id="m-contact">${opt("","—")}${S.contacts.map(c=>opt(c.id,`${c.name}${c.obj?` · ${c.obj}`:""}`,c.id===base.contact)).join("")}</select></label>
      <label>განმეორება<select class="sel" id="m-recur">${Object.entries(RECUR).map(([k,l])=>opt(k,l,k===(base.recur||""))).join("")}</select></label>
      <label>პროგრესი<span class="rng"><input type="range" id="m-prog" min="0" max="100" step="10" value="${Math.round((+base.progress||0)*100)}"><span class="num" id="m-prog-v">${Math.round((+base.progress||0)*100)}%</span></span></label>
      <div class="full subs-ed"><span class="lbl">ფოტოები და ფაილები <span class="upl" id="m-upl"></span></span><div class="files" id="m-files"></div></div>
      <div class="full subs-ed"><span class="lbl">ქვედავალებები (პროგრესი ავტომატურად ითვლება)</span><div id="m-subs"></div>
        <div class="srow"><input class="inp" id="m-sub-new" placeholder="ახალი პუნქტი… (Enter)"><button type="button" class="btn" id="m-sub-add">დამატება</button></div></div>
      <label class="full">შენიშვნა<textarea class="inp" id="m-note" rows="3">${esc(base.note)}</textarea></label>
      ${logOf(base).length ? `<div class="full subs-ed"><span class="lbl">ისტორია / კომენტარები</span><div class="loglist">${[...logOf(base)].reverse().map(x => `<div><b class="k-${x.kind}">${LOG_KIND[x.kind]||""}</b><span class="hint num">${esc(stampShort(x.at))}</span>${x.kind==="moved"&&x.to?` <span class="hint">→ ${esc(fmt(x.to.slice(0,10)))}${x.to.length>10?" "+esc(x.to.slice(11)):""}</span>`:""}${x.text?`<br>${esc(x.text)}`:""}</div>`).join("")}</div></div>` : ""}
      <p class="hint full" id="m-err" hidden style="color:var(--red)"></p>
    </form>
    <div class="mfoot">
      <div class="r">${isNew?"":`<button class="btn danger" id="m-del">წაშლა</button><button class="btn" id="m-send">შენახვა და გაგზავნა</button>`}<a class="btn" id="m-gcal" href="#" target="_blank" rel="noopener" style="text-decoration:none">📅 Google Calendar</a></div>
      <div class="r"><button class="btn" id="m-cancel">გაუქმება</button><button class="btn primary" id="m-save">შენახვა</button></div>
    </div></div></div>`;
  modalTask._new = isNew;
  modalTask.subs = subsOf(base).map(x => ({...x}));
  modalTask.files = filesOf(base).map(x => ({...x})); modalTask.fresh = []; modalTask.removed = [];
  renderEdFiles();
  renderSubsEd();
  updateGcal();
  setTimeout(()=>$("#m-title").focus(), 0);
}
function updateGcal(){
  const a = $("#m-gcal"); if (!a) return;
  const url = gcalUrl({ title: $("#m-title").value.trim() || "დავალება", due: $("#m-due").value, time: $("#m-time").value, obj: $("#m-obj").value, note: $("#m-note").value.trim(), subs: modalTask ? modalTask.subs : [] });
  a.href = url || "#"; a.hidden = !url;
}
function renderEdFiles(){ const b = $("#m-files"); if (b && modalTask) b.innerHTML = filesEditorHtml(modalTask.files, "m"); }
function readSubsEd(){
  if (!modalTask) return;
  document.querySelectorAll("[data-subtxt]").forEach(inp => { const i = +inp.dataset.subtxt; if (modalTask.subs[i]) modalTask.subs[i].t = inp.value; });
}
function renderSubsEd(){
  const box = $("#m-subs"); if (!box || !modalTask) return;
  box.innerHTML = modalTask.subs.map((x,i)=>`<div class="srow"><button type="button" class="sbox${x.d?" on":""}" data-subed="${i}" aria-label="მონიშვნა">${ICON_CHECK}</button><input class="inp" data-subtxt="${i}" value="${esc(x.t)}" aria-label="ქვედავალება ${i+1}"><button type="button" class="x" data-subdel="${i}" aria-label="წაშლა">×</button></div>`).join("");
  const r = modalTask.subs.length ? modalTask.subs.filter(x=>x.d).length / modalTask.subs.length : null;
  const sl = $("#m-prog"); if (sl){ sl.disabled = r !== null; if (r !== null){ sl.value = Math.round(r*100); $("#m-prog-v").textContent = Math.round(r*100) + "%"; } }
}
function discardModal(){
  const fresh = (modalTask && modalTask.fresh) || (outState && outState.fresh) || [];
  deleteAssets(fresh); closeModal();
}
function closeModal(){ $("#modal-root").innerHTML = ""; modalTask = null; sendState = null; outState = null; }
function submitModal(){
  const title = $("#m-title").value.trim(), start = $("#m-start").value, due = $("#m-due").value;
  const err = $("#m-err");
  if (!title){ err.textContent = "ჩაწერეთ დავალების დასახელება."; err.hidden = false; return; }
  if (start && due && due < start){ err.textContent = "ვადა დაწყების თარიღზე ადრეა — შეასწორეთ ერთ-ერთი."; err.hidden = false; return; }
  const isNew = modalTask._new, prevStatus = isNew ? null : S.tasks.get(modalTask.id)?.status;
  const t = {...modalTask, title, obj:$("#m-obj").value, cat:$("#m-cat").value, pri:$("#m-pri").value, start, due,
    recur:$("#m-recur").value, contact:$("#m-contact").value, progress:+$("#m-prog").value/100, note:$("#m-note").value.trim(), updated:Date.now(),
    time: due ? $("#m-time").value : "" };
  readSubsEd(); const pendingSub = $("#m-sub-new").value.trim(); if (pendingSub) modalTask.subs.push({t:pendingSub, d:false});
  t.subs = modalTask.subs.map(x => ({t:String(x.t||"").trim(), d:!!x.d})).filter(x => x.t);
  t.files = modalTask.files.map(x => ({...x})); delete t.fresh; delete t.removed;
  deleteAssets(modalTask.removed);
  if (t.subs.length) t.progress = t.subs.filter(x=>x.d).length / t.subs.length;
  delete t._new;
  const status = $("#m-status").value;
  closeModal();
  if (isNew){ t.status = status; if (status==="done"){ t.doneAt = todayStr(); t.progress = 1; } saveTask(t); $("#qa-title").value = ""; toast("დავალება დაემატა"); }
  else if (status !== prevStatus){ t.status = prevStatus; S.tasks.set(t.id, t); setStatus(t, status); }
  else { if (status==="done") t.progress = 1; saveTask(t); toast("შენახულია"); }
}

function addSubFromInput(){
  const inp = $("#m-sub-new"); const v = inp.value.trim(); if (!v || !modalTask) return;
  readSubsEd(); modalTask.subs.push({t:v, d:false}); inp.value = ""; renderSubsEd(); inp.focus();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo, label){
  clearTimeout(toastTimer);
  $("#toast-root").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button id="t-undo">${esc(label||"დაბრუნება")}</button>`:""}</div>`;
  if (undo) $("#t-undo").onclick = () => { undo(); $("#toast-root").innerHTML = ""; };
  toastTimer = setTimeout(()=>{ $("#toast-root").innerHTML = ""; }, undo ? 6000 : 2500);
}

/* ---------- events ---------- */
function setView(v){ S.view = v; try{ localStorage.setItem("tm.view", v); }catch(e){} render(); window.scrollTo({top:0}); }
function saveF(){ try{ localStorage.setItem("tm.f", JSON.stringify({...S.f, q:""})); }catch(e){} }

document.addEventListener("pointerdown", unlockAudio, { capture:true });
document.addEventListener("keydown", unlockAudio, { capture:true });
document.addEventListener("click", e => {
  if (e.target.closest("#al-done")) return closeAlarm("done");
  if (e.target.closest("#al-snooze")) return closeAlarm("snooze");
  if (e.target.closest("#al-close")) return closeAlarm("close");
  if (e.target.closest("#bell")){
    if (!ALARM.unlocked && ALARM.on){ unlockAudio(); setTimeout(() => { beep(); renderBell(); }, 120); toast("ხმა ჩართულია — ასე გაისმის სიგნალი"); return; }
    ALARM.on = !ALARM.on; try { localStorage.setItem("tm.alarm", ALARM.on ? "on" : "off"); } catch(x){}
    renderBell(); toast(ALARM.on ? "სიგნალი ჩართულია" : "სიგნალი გამორთულია"); return;
  }
  const el = e.target.closest("[data-view],[data-go],[data-act],[data-due],[data-del],[data-delc],[data-sort],tr.row,#qa-more,#export,#scrim,#m-cancel,#m-save,#m-del,#m-send,#send-day,#s-copy,#s-wa,#s-vb,[data-sub],[data-subed],[data-subdel],#m-sub-add,#o-done,#o-move,#o-note,#o-gcal,[data-chip],[data-pick],[data-m-rm],[data-o-rm],[data-view-img],[data-open-file],[data-sheet],[data-dperiod],#lb-close,#lightbox");
  if (!el) return;
  if (el.id==="scrim"){ if (e.target===el) discardModal(); return; }
  if (el.id==="m-cancel") return discardModal();
  if (el.id==="m-save") return submitModal();
  if (el.id==="m-del"){
    if (el.dataset.armed){ const id = modalTask.id, prev = S.tasks.get(id); closeModal(); removeTask(id); toast("დავალება წაიშალა", () => saveTask(prev)); }
    else { el.dataset.armed = "1"; el.textContent = "დაადასტურეთ წაშლა"; }
    return;
  }
  if (el.id==="qa-more") return openEditor(null);
  if (el.id==="m-sub-add"){ addSubFromInput(); return; }
  if (el.id==="lb-close" || (el.id==="lightbox" && e.target===el)) return closeLightbox();
  if (el.dataset.sheet !== undefined) return showSheet(+el.dataset.sheet);
  if (el.dataset.dperiod){ S.d.period = el.dataset.dperiod; render(); return; }
  if (el.id==="lightbox") return;
  if (el.dataset.openFile){ e.stopPropagation(); return openDoc(el.dataset.openFile); }
  if (el.dataset.viewImg){ e.stopPropagation(); return openLightbox(el.dataset.viewImg); }
  if (el.dataset.pick === "m" && modalTask){ readSubsEd(); return pickFiles({ list: modalTask.files, fresh: modalTask.fresh, render: renderEdFiles, statusSel:"#m-upl" }); }
  if (el.dataset.pick === "o" && outState) return pickFiles({ list: outState.files, fresh: outState.fresh, render: renderOutFiles, statusSel:"#o-upl" });
  if (el.dataset.mRm !== undefined && modalTask){ const f = modalTask.files.splice(+el.dataset.mRm, 1)[0];
    if (f){ if (modalTask.fresh.includes(f.id)) deleteAssets([f.id]); else modalTask.removed.push(f.id); } renderEdFiles(); return; }
  if (el.dataset.oRm !== undefined && outState){ const f = outState.files.splice(+el.dataset.oRm, 1)[0]; if (f) deleteAssets([f.id]); renderOutFiles(); return; }
  if (el.id==="o-done") return applyOutcome("done");
  if (el.id==="o-move") return applyOutcome("moved");
  if (el.id==="o-gcal"){ setTimeout(() => applyOutcome("moved"), 0); return; }   // the link opens Google Calendar; then the task moves
  if (el.id==="o-note") return applyOutcome("note");
  if (el.dataset.chip){ const ta = $("#o-text"); ta.value = (ta.value.trim() ? ta.value.trim() + ". " : "") + el.dataset.chip; outState && (outState.manual = false); updateOutcome(); ta.focus(); return; }
  if (el.dataset.subed !== undefined){ readSubsEd(); const x = modalTask.subs[+el.dataset.subed]; if (x){ x.d = !x.d; renderSubsEd(); } return; }
  if (el.dataset.subdel !== undefined){ readSubsEd(); modalTask.subs.splice(+el.dataset.subdel, 1); renderSubsEd(); return; }
  if (el.dataset.sub !== undefined){
    const c = el.closest("[data-id]"); const t = c && S.tasks.get(c.dataset.id); if (!t) return;
    const subs = subsOf(t).map(x=>({...x})); const x = subs[+el.dataset.sub]; if (!x) return; x.d = !x.d;
    const ratio = subs.filter(y=>y.d).length / subs.length;
    const upd = {...t, subs, progress: ratio, status: t.status==="todo" && ratio>0 ? "doing" : t.status, updated: Date.now()};
    saveTask(upd);
    if (ratio === 1) toast("ყველა პუნქტი მონიშნულია", () => setStatus(S.tasks.get(t.id), "done"), "შესრულებულად მონიშვნა");
    return;
  }
  if (el.id==="send-day") return openSend(dayText(), "");
  if (el.id==="s-copy") return copyText($("#s-text").value);
  if (el.id==="s-wa" || el.id==="s-vb"){ if (!normPhone($("#s-phone").value) && el.id==="s-vb") toast("Viber-ში აირჩიეთ ადრესატი"); return; }  // the link itself opens the app
  if (el.id==="m-send"){ const id = modalTask && modalTask.id; submitModal(); if (!modalTask && id){ const t = S.tasks.get(id); if (t) openSend(taskText(t), t.contact || (S.contacts.find(c=>c.obj && c.obj===t.obj)||{}).id || ""); } return; }
  if (el.dataset.delc){ const i = S.contacts.findIndex(c=>c.id===el.dataset.delc); if (i<0) return; const removed = S.contacts[i];
    S.contacts = S.contacts.filter((_,j)=>j!==i); saveContacts(); toast(`წაიშალა: ${removed.name}`, () => { S.contacts.splice(i,0,removed); saveContacts(); }); return; }
  if (el.id==="export") return exportXlsx();
  if (el.dataset.view) return setView(el.dataset.view);
  if (el.dataset.go){
    const g = el.dataset.go; if (g==="today") return setView("today"); if (g==="done") return setView("done");
    S.f = {...S.f, q:"", obj:"", cat:"", pri:"", status: g==="all-any" ? "any" : g.slice(4)}; saveF(); return setView("all");
  }
  if (el.dataset.due !== undefined){ S.quickDue = +el.dataset.due; render(); return; }
  if (el.dataset.sort){ S.f.sort = el.dataset.sort; saveF(); render(); return; }
  if (el.dataset.del){
    const [key, i] = el.dataset.del.split(":"); const removed = S.lists[key][+i];
    S.lists[key] = S.lists[key].filter((_,j)=>j!==+i); saveLists();
    toast(`წაიშალა: ${removed}`, () => { S.lists[key].splice(+i,0,removed); saveLists(); }); return;
  }
  if (el.matches("tr.row")) return openEditor(S.tasks.get(el.dataset.id));
  const c = el.closest("[data-id]"); const t = c && S.tasks.get(c.dataset.id); if (!t) return;
  const act = el.dataset.act;
  if (act==="toggle"){ if (t.status==="done") setStatus(t, "todo"); else openOutcome(t); }
  else if (act==="edit") openEditor(t);
  else if (act==="doing" || act==="todo") setStatus(t, act);
  else if (act==="send") openSend(taskText(t), t.contact || (S.contacts.find(c=>c.obj && c.obj===t.obj)||{}).id || "");
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id==="m-prog") $("#m-prog-v").textContent = e.target.value + "%";
  if (id==="s-phone" || id==="s-text") updateSendLinks();

  if (["m-title","m-due","m-time","m-note"].includes(id)) updateGcal();
  if ((id==="o-date" || id==="o-time") && outState){ outState.manual = true; updateOutcome(); }
  if (id==="f-q"){ S.f.q = e.target.value; render(); }
  if (id==="d-q"){ S.d.q = e.target.value; render(); }
});
document.addEventListener("change", e => {
  if (["m-due","m-time","m-obj"].includes(e.target.id)) updateGcal();
  if (e.target.id==="d-obj"){ S.d.obj = e.target.value; render(); return; }
  if (e.target.id==="file-input"){ uploadPicked([...e.target.files]); return; }
  const m = { "f-status":"status", "f-obj":"obj", "f-cat":"cat", "f-pri":"pri" }[e.target.id];
  if (m){ S.f[m] = e.target.value; saveF(); render(); }
  if (e.target.id==="s-who"){ const c = contactById(e.target.value); const ph = $("#s-phone");
    if (c) ph.value = c.phone; else { ph.value = ""; if (e.target.value==="__other") ph.focus(); } updateSendLinks(); }
  if (e.target.id==="m-status" && e.target.value==="done"){ $("#m-prog").value = 100; $("#m-prog-v").textContent = "100%"; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id==="qa"){
    const raw = $("#qa-title").value.trim(); if (!raw){ $("#qa-title").focus(); return; }
    if (!S.loaded){ toast("მონაცემები ჯერ იტვირთება — სცადეთ წამში."); return; }
    const p = parseQuick(raw), title = p.title || raw;
    const due = p.due !== undefined ? p.due : (S.quickDue<0 ? "" : addDays(todayStr(), S.quickDue));
    const t = { id:newId(), title, obj: p.obj ?? $("#qa-obj").value, cat: p.cat ?? $("#qa-cat").value, pri: p.pri ?? $("#qa-pri").value,
      start: due && due < todayStr() ? due : todayStr(), due, time: p.time || "", status:"todo", progress:0, note:"", recur: p.recur || "", subs:[],
      created:Date.now(), updated:Date.now() };
    saveTask(t); $("#qa-title").value = ""; renderParse();
    toast(`დაემატა: ${title}${due?` · ${diff(due)===0?"დღეს":fmtShort(due)}`:""}${t.time?` ${t.time}`:""}`); return;
  }
  if (e.target.id==="m-form") return submitModal();
  if (e.target.id==="s-form" || e.target.id==="o-form") return;
  if (e.target.id==="c-add"){
    const name = $("#c-name").value.trim(), phone = $("#c-phone").value.trim(), obj = $("#c-obj").value;
    if (!name){ toast("ჩაწერეთ სახელი"); $("#c-name").focus(); return; }
    const d = normPhone(phone);
    if (d.length < 9){ toast("ნომერი არასრულია — მაგ. 599 12 34 56"); $("#c-phone").focus(); return; }
    S.contacts = [...S.contacts, { id: "c" + Date.now().toString(36), name, phone: "+" + d, obj }];
    saveContacts(); toast(`დაემატა: ${name}`);
    setTimeout(()=>{ const n = $("#c-name"); if (n) n.focus(); }, 0); return;
  }
  const key = e.target.dataset.add;
  if (key){ const inp = $(`#add-${key}`), v = inp.value.trim();
    if (v && !S.lists[key].includes(v)){ S.lists[key] = [...S.lists[key], v]; saveLists(); toast(`დაემატა: ${v}`); }
    else if (v) toast("ეს უკვე სიაშია");
    setTimeout(()=>{ const i = $(`#add-${key}`); if (i){ i.value=""; i.focus(); } },0);
  }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && $("#lightbox")) return closeLightbox();
  if (e.key==="Escape" && $("#scrim")) return discardModal();
  if (outState && e.key==="Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return applyOutcome($("#o-date").value ? "moved" : "done"); }
  if (e.key==="Enter" && modalTask && e.target.id==="m-sub-new"){ e.preventDefault(); return addSubFromInput(); }
  if (e.key==="Enter" && modalTask && e.target.dataset && e.target.dataset.subtxt !== undefined){ e.preventDefault(); $("#m-sub-new").focus(); return; }
  if (e.key==="Enter" && modalTask && e.target.tagName==="INPUT"){ e.preventDefault(); return submitModal(); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (!typing && !modalTask && (e.key==="n" || e.key==="N" || e.key==="ნ")){ e.preventDefault(); if ($("#qa").hidden) setView("today"); $("#qa-title").focus(); }
});

/* drag & drop (board: status, week: due date) */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".card[draggable]"); if (!c) return; dragId = c.dataset.id; c.classList.add("drag"); try{ e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed="move"; }catch(x){} });
document.addEventListener("dragend", e => { dragId = null; document.querySelectorAll(".drag,.over").forEach(x=>x.classList.remove("drag","over")); });
document.addEventListener("dragover", e => { const col = e.target.closest?.("[data-status],[data-date]"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.("[data-status],[data-date]"); if (!col || !dragId) return; e.preventDefault();
  const t = S.tasks.get(dragId); dragId = null; if (!t) return;
  if (col.dataset.status && col.dataset.status !== t.status) setStatus(t, col.dataset.status);
  if (col.dataset.date && col.dataset.date !== t.due){ const prev = {...t}; const start = t.start && t.start > col.dataset.date ? col.dataset.date : t.start;
    saveTask({...t, due:col.dataset.date, start, updated:Date.now()}); toast(`ვადა: ${fmtShort(col.dataset.date)}`, ()=>saveTask(prev)); }
});

/* ---------- export ---------- */
function loadXlsx(){
  return new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); });
}
async function exportXlsx(){
  if (!S.downloads) return;
  const btn = $("#export"); btn.disabled = true; btn.textContent = "მზადდება…";
  try{
    const X = await loadXlsx();
    const head = ["ID","დავალების დასახელება","კატეგორია","ობიექტი / ქვეკატეგორია","პრიორიტეტი","დაწყების თარიღი","შესრულების ვადა (Deadline)","დარჩენილი დღეები","სტატუსი","შეხსენება / გაფრთხილება","პროგრესი (%)","განმეორება","შენიშვნა","საათი","ქვედავალებები","კომენტარები","ფაილები"];
    const toDate = s => s ? new Date(ms(s)) : "";
    const rows = all().sort((a,b)=>(a.created||0)-(b.created||0)).map((t,i) => [i+1, t.title, t.cat, t.obj, PRI[t.pri]||"", toDate(t.start), toDate(t.due),
      t.due && t.status!=="done" ? diff(t.due) : "", STATUS[t.status], dueLabel(t), progressOf(t), RECUR[t.recur||""], t.note, t.time||"", subsOf(t).map(x=>`${x.d?"☑":"☐"} ${x.t}`).join("; "), logOf(t).map(x=>`${stampShort(x.at)} ${LOG_KIND[x.kind]||""}${x.to?` → ${x.to}`:""}${x.text?`: ${x.text}`:""}`).join(" | "), filesOf(t).map(f=>f.name).join("; ")]);
    const ws = X.utils.aoa_to_sheet([head, ...rows], {cellDates:true, dateNF:"dd.mm.yyyy"});
    ws["!cols"] = [6,34,14,20,12,14,16,12,16,26,12,18,34,8,40,50,30].map(w=>({wch:w}));
    ws["!autofilter"] = { ref: `A1:Q${rows.length+1}` };
    for (let r=1;r<=rows.length;r++){ for (const c of ["F","G"]){ const cell = ws[`${c}${r+1}`]; if (cell && cell.t==="d") cell.z = "dd.mm.yyyy"; }
      const p = ws[`K${r+1}`]; if (p) p.z = "0%"; }
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "დავალებები");
    const data = X.write(wb, {bookType:"xlsx", type:"array", cellDates:true});
    await S.downloads.save({ filename:`დავალებები_${todayStr()}.xlsx`, data: new Uint8Array(data) });
  } catch(e){
    if (!(e && e.code==="declined")) toast(e && e.code==="rate_limited" ? "ჩამოტვირთვა უკვე მიმდინარეობს — სცადეთ ცოტა ხანში." : "ექსპორტი ვერ მოხერხდა.");
  } finally { const b = $("#export"); if (b){ b.disabled = false; b.textContent = "ჩამოტვირთვა (.xlsx)"; } }
}

/* ---------- boot ---------- */
// 1) show the local copy straight away
{
  const cached = lsGet(LS.tasks, null), lists = lsGet(LS.lists, null);
  if (Array.isArray(cached)){ S.tasks = new Map(cached.filter(t=>t && t.id && t.title).map(t=>[t.id, t])); S.loaded = true; }
  if (lists && Array.isArray(lists.objects) && Array.isArray(lists.categories)) S.lists = lists;
  const cts = lsGet(LS.contacts, null); if (Array.isArray(cts)) S.contacts = cts;
}
render(); setSync("local");
setInterval(() => { if (!modalTask) render(); }, 60_000);
setInterval(checkAlarms, 15_000); setTimeout(checkAlarms, 3000);
renderBell();   // roll over at midnight, refresh due labels
window.addEventListener("online", () => flush());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush(); });

// 2) connect to the server store, then send anything waiting
(async () => {
  const use = name => { try { return Promise.resolve(window.claude?.use?.(name) ?? null).catch(() => null); } catch(e){ return Promise.resolve(null); } };
  const [db, dl, as] = await Promise.all([use("db"), use("downloads"), use("assets")]);
  S.downloads = dl; S.assets = as;
  if (!db){
    S.loaded = true; setSync("local");
    const b = $("#banner"); b.hidden = false;
    b.textContent = "სერვერთან კავშირი ამ ხედში ვერ დამყარდა. დავალებები შენახულია მხოლოდ ამ მოწყობილობაზე/ბრაუზერში — სხვა მოწყობილობაზე არ გამოჩნდება. შეამოწმეთ ინტერნეტი და მენეჯერის PIN, მერე განაახლეთ გვერდი.";
    render(); return;
  }
  S.db = db;
  db.doc("config/lists").onSnapshot(snap => {
    if (outbox.config) return;                       // our own unsent list change wins
    if (snap.exists){ const d = snap.data();
      S.lists = { categories: Array.isArray(d.categories)?[...d.categories]:[...DEFAULT_LISTS.categories], objects: Array.isArray(d.objects)?[...d.objects]:[...DEFAULT_LISTS.objects] };
      lsSet(LS.lists, S.lists); render(); }
  }, () => {});
  db.doc("config/contacts").onSnapshot(snap => {
    if (outbox.contacts) return;
    if (snap.exists){ const d = snap.data(); if (Array.isArray(d.list)){ S.contacts = d.list.map(c => ({...c})); lsSet(LS.contacts, S.contacts); render(); } }
  }, () => {});
  db.collection("tasks").limit(1000).onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs){ const v = d.data(); if (v && v.title) m.set(d.id, {...v, id:d.id, status: STATUS[v.status] ? v.status : "todo"}); }
    S.tasks = overlay(m); S.loaded = true;
    lsSet(LS.tasks, [...S.tasks.values()]);
    if (!flushing && sync.state !== "error") setSync("saved");
    render();
  }, err => {
    S.loaded = true; setSync("error", err.code || "");
    const b = $("#banner"); b.hidden = false;
    b.textContent = "სერვერიდან განახლება შეწყდა — თქვენი ცვლილებები ინახება ამ მოწყობილობაზე. განაახლეთ გვერდი.";
    render();
  });
  flush();
})();
})();
</script>
