async function viewPrices(main) {
  main.innerHTML = `<div class="grid2"><select id="pl"></select><input type="search" id="qs" placeholder="ძებნა: კოდი, დასახელება"></div>
    <div class="grid2" style="margin-top:8px"><select id="cf"><option value="">ყველა კატეგორია</option></select><div class="muted small" style="align-self:center">ფასი დღგ-ს ჩათვლით. ცვლილება მოქმედებს დღეიდან.</div></div>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table><thead><tr><th></th><th>კოდი</th><th>დასახელება</th><th class="right">საცალო</th><th class="right">ამ პრაისში</th><th class="right">ახალი ფასი</th></tr></thead><tbody id="tb"><tr><td colspan="6">${loading()}</td></tr></tbody></table></div>`;
  let lists, products, cats;
  try {
    [lists, products, cats] = await Promise.all([
      q(sb.from("price_lists").select("id, name, is_retail").eq("active", true).order("id")),
      q(sb.from("products").select("id, code, name, category_id, image_url").eq("active", true).limit(2000)),
      q(sb.from("categories").select("id, name, sort").order("sort")),
    ]);
  } catch (e) { return fail(e); }
  S.cache.lists = lists; products.sort(byCode);
  const retail = lists.find(l => l.is_retail);
  const pl = main.querySelector("#pl");
  pl.innerHTML = lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  main.querySelector("#cf").innerHTML += cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const latest = async (listId) => {
    const rows = await q(sb.from("price_list_items").select("product_id, price, valid_from").eq("price_list_id", listId).order("valid_from", { ascending: false }).limit(10000));
    const m = new Map(); rows.forEach(r => { if (!m.has(r.product_id)) m.set(r.product_id, r); }); return m;
  };
  let base = await latest(retail.id), cur = base;
  const draw = () => {
    const s = norm(main.querySelector("#qs").value), cf = main.querySelector("#cf").value, isRetail = Number(pl.value) === retail.id;
    const r = products.filter(p => (!cf || String(p.category_id) === cf) && (!s || norm(p.code + " " + p.name).includes(s))).slice(0, 400);
    main.querySelector("#tb").innerHTML = r.map(p => { const c = cur.get(p.id), b = base.get(p.id);
      return `<tr data-id="${p.id}"><td style="width:44px">${imgTag(p, 36)}</td><td><b>${esc(p.code)}</b></td><td class="small">${esc(p.name)}</td>
        <td class="right num">${money(b?.price)}</td>
        <td class="right num">${isRetail ? "—" : (c ? money(c.price) : `<span class="muted small">საცალოთი</span>`)}${c ? `<div class="muted small">${dt(c.valid_from === "2024-01-01" ? null : c.valid_from)}</div>` : ""}</td>
        <td class="right"><input type="number" step="0.01" min="0" class="np" style="width:90px" placeholder="${(isRetail ? b?.price : c?.price ?? b?.price) ?? ""}"></td></tr>`; }).join("")
      || `<tr><td colspan="6" class="empty">ვერ მოიძებნა</td></tr>`;
    main.querySelectorAll("#tb .np").forEach(inp => inp.onchange = async () => {
      const id = Number(inp.closest("tr").dataset.id), v = Number(inp.value);
      if (!(v > 0)) return toast("ფასი უნდა იყოს 0-ზე მეტი", true);
      try {
        await q(sb.from("price_list_items").upsert({ price_list_id: Number(pl.value), product_id: id, price: v, valid_from: today() }, { onConflict: "price_list_id,product_id,valid_from" }));
        const rec = { product_id: id, price: v, valid_from: today() };
        cur.set(id, rec); if (Number(pl.value) === retail.id) base.set(id, rec);
        toast(`${products.find(p => p.id === id)?.code}: ${money(v)}`); draw();
      } catch (e) { fail(e); }
    });
  };
  pl.onchange = async () => { main.querySelector("#tb").innerHTML = `<tr><td colspan="6">${loading()}</td></tr>`; cur = Number(pl.value) === retail.id ? base : await latest(Number(pl.value)); draw(); };
  main.querySelector("#qs").oninput = draw; main.querySelector("#cf").onchange = draw; draw();
}

async function pickScreen(main, orderId, back) {
  main.innerHTML = loading();
  let o, items, exps;
  try {
    o = await cq("order:" + orderId, () => q(sb.from("orders").select(ORDER_SELECT).eq("id", orderId).single()));
    items = (await cq("items:" + orderId, () => q(sb.from("order_items").select("id, order_id, product_id, qty_ordered, qty_shipped, pick_status, product:products(code, name, image_url)").eq("order_id", orderId)))).sort(byCode);
    exps = (await staffList()).filter(p => p.active && p.role === "expeditor");
  } catch (e) { return fail(e); }
  const c = o.outlet?.customer;
  const editable = ["confirmed", "picked"].includes(o.status);

  main.innerHTML = `<div class="row" style="margin-bottom:8px"><button class="btn ghost sm" id="bk">‹ უკან</button>
      <div class="grow"><b>${esc(o.number)}</b> ${badge(o.status)}<div class="muted small ell">${esc(c?.network || c?.name || "")} · ${esc(o.outlet?.delivery_address || "")}</div></div></div>
    <div class="muted small">მიწოდება ${dt(o.delivery_date)} · აგენტი ${esc(o.agent?.full_name || "—")}</div>
    ${o.comment ? `<div class="card" style="background:var(--warn-soft);border-color:transparent;margin-top:8px">💬 ${esc(o.comment)}</div>` : ""}
    <div class="row" style="margin-top:10px"><div class="grow muted small" id="pg"></div></div>
    <div class="progress"><div id="pgb" style="width:0"></div></div>
    <div id="rows"></div>`;
  main.querySelector("#bk").onclick = () => { bar.remove(); back?.(); };

  const bar = h(`<div class="bar"><div class="grow" id="bl"></div><select id="ex" style="max-width:190px;display:none"><option value="">— ექსპედიტორი —</option>${exps.map(p => `<option value="${p.id}">${esc(p.full_name)}</option>`).join("")}</select><button class="btn" id="fin" disabled></button></div>`);
  document.body.appendChild(bar);
  $app.querySelectorAll("nav button, #out").forEach(b => b.addEventListener("click", () => bar.remove(), { once: true }));

  const save = async (it, status, qty) => {
    const patch = { pick_status: status, qty_shipped: status === "picked" ? qty : status === "rejected" ? 0 : null };
    await act({ type: "pick", item_id: it.id, patch, label: `${o.number} · ${it.product?.code}` });
    Object.assign(it, patch); LS.set("c:items:" + o.id, items);
  };

  const rows = main.querySelector("#rows");
  const draw = () => {
    rows.innerHTML = items.map(it => `<div class="pick ${it.pick_status || ""}" data-i="${it.id}">
        ${imgTag(it.product, 56)}
        <div class="grow"><div style="font-size:17px"><b>${esc(it.product?.code)}</b></div><div class="muted small">${esc(it.product?.name)}</div>
          ${it.pick_status === "picked" && Number(it.qty_shipped) !== Number(it.qty_ordered) ? `<div class="small" style="color:var(--warn)">აიღო ${qtyf(it.qty_shipped)} / ${qtyf(it.qty_ordered)}</div>` : ""}
          ${it.pick_status === "rejected" ? `<div class="small" style="color:var(--bad)">უარყოფილია — ნაშთზე არ არის</div>` : ""}</div>
        <div class="q num" title="რაოდენობა">${qtyf(it.qty_ordered)}</div>
        ${editable ? `<button class="yes ${it.pick_status === "picked" ? "on" : ""}" title="აიღო">✓</button><button class="no ${it.pick_status === "rejected" ? "on" : ""}" title="უარყო">✕</button>` : ""}
      </div>`).join("");
    const done = items.filter(i => i.pick_status).length, picked = items.filter(i => i.pick_status === "picked").length;
    main.querySelector("#pg").textContent = `მონიშნულია ${done} / ${items.length} · აიღო ${picked} · უარყო ${done - picked}`;
    main.querySelector("#pgb").style.width = (items.length ? (100 * done / items.length) : 0) + "%";
    const fin = bar.querySelector("#fin"), ex = bar.querySelector("#ex"), bl = bar.querySelector("#bl");
    if (o.status === "confirmed") {
      fin.textContent = "აწყობის დასრულება"; fin.disabled = done < items.length; ex.style.display = "none";
      bl.innerHTML = done < items.length ? `<span class="muted small">დარჩა ${items.length - done} მოუნიშნავი</span>` : `<span class="small" style="color:var(--ok)">ყველა მოინიშნა ✓</span>`;
    } else if (o.status === "picked") {
      const mgr = ["admin", "manager"].includes(S.profile.role);

    } else { bar.style.display = "none"; }

    if (!editable) return;
    rows.querySelectorAll(".pick").forEach(r => {
      const it = items.find(x => x.id == r.dataset.i);
      const run = async (fn) => { r.style.opacity = .6; try { await fn(); } catch (e) { fail(e); } draw(); };
      r.querySelector(".yes").onclick = () => run(() => save(it, it.pick_status === "picked" ? null : "picked", it.qty_ordered));
      r.querySelector(".no").onclick = () => run(() => save(it, it.pick_status === "rejected" ? null : "rejected"));
      r.querySelector(".q").onclick = () => modal(`<h3>${esc(it.product?.code)} — რამდენი აიღო?</h3><div class="muted small">შეკვეთილია ${qtyf(it.qty_ordered)}</div>

        (m, close) => { m.querySelector('[data-a=no]').onclick = close; const pq = m.querySelector("#pq"); pq.focus(); pq.select();
          m.querySelector('[data-a=ok]').onclick = () => { const v = Math.max(0, Math.min(Number(it.qty_ordered), Math.floor(Number(pq.value) || 0))); close(); run(() => save(it, v > 0 ? "picked" : "rejected", v)); }; });
    });
  };
  bar.querySelector("#fin").onclick = async (ev) => {
    ev.target.disabled = true;

      if (o.status === "confirmed") {

        o.status = "picked"; moveWh(o, "confirmed", "picked"); main.querySelector(".badge").outerHTML = badge("picked");
        if (!r?.queued) { try { const f = await q(sb.from("orders").select("expeditor_id, expeditor:profiles!orders_expeditor_id_fkey(full_name)").eq("id", o.id).single()); Object.assign(o, f); } catch {} }

        ev.target.disabled = false;
        return openOrder(o.id, () => { bar.remove(); moveWh(o, "picked", null); back?.(); });
      }
    } catch (e) { fail(e); }
    draw();
  };
  draw();
}

async function customerList() {
  if (!S.cache.customers) S.cache.customers = await cq("customers", () => q(sb.from("customers").select("id, name, tax_id, network, payment_term").order("name").limit(2000)));
  return S.cache.customers;
}
const SRC = { bank: "🏦 ბანკი", cash: "💵 ნაღდი", manual: "ხელით" };
const custLabel = (c) => c ? `${c.network && c.network !== c.name ? c.network + " · " : ""}${c.name} (${c.tax_id})` : "—";
const custOpts = (list, sel) => `<option value="">— ვერ ამოიცნო, აირჩიე —</option>` + [...list].sort((a, b) => custLabel(a).localeCompare(custLabel(b), "ka")).map(c => `<option value="${c.id}" ${c.id == sel ? "selected" : ""}>${esc(custLabel(c))}</option>`).join("");
// payer → customer: tax ID column, a tax ID inside the text, then the name
function matchPayer(row, customers) {
  const byTin = new Map(customers.map(c => [String(c.tax_id), c]));
  const pid = String(row.payer_tax_id || "").replace(/\D/g, "");
  if (pid && byTin.has(pid)) return [byTin.get(pid), "ს/კ"];
  for (const t of tinsOf(`${row.description || ""} ${row.payer_name || ""}`)) if (byTin.has(t)) return [byTin.get(t), "ს/კ ტექსტში"];
  const nk = nameKey(row.payer_name);
  if (nk.length >= 4) {
    const hit = customers.filter(c => { const ck = nameKey(c.name); return ck.length >= 4 && (ck === nk || nk.includes(ck) || ck.includes(nk)); });
    if (hit.length === 1) return [hit[0], "დასახელება"];
  }
  const dk = nameKey(row.description);
  if (dk.length >= 6) {
    const hit = customers.filter(c => { const ck = nameKey(c.name); return ck.length >= 5 && dk.includes(ck); });
    if (hit.length === 1) return [hit[0], "დანიშნულება"];
  }
  return [null, null];
}

      list.querySelectorAll(".del").forEach(b => b.onclick = async () => { const p = rows.find(x => x.id == b.closest(".item").dataset.id);
        if (!(await ask(`${money(p.amount)} (${dt(p.paid_on)}) წაიშალოს სამუდამოდ?${st === "confirmed" ? " ვალს ისევ დაემატება." : ""}`, "წაშლა", true))) return;
        try { await q(sb.from("payments").delete().eq("id", p.id)); rows = rows.filter(x => x !== p); toast("წაიშალა"); draw(); } catch (e) { fail(e); } });

      sec.innerHTML = `<div class="card" style="background:var(--brand-soft);border-color:transparent">

        ${known.map(p => `<div class="card pay ${hint.has(p.id) ? "wbm" : ""}" data-id="${p.id}"><div class="row" style="align-items:flex-start">
          ${mgr ? `<input type="checkbox" class="ck" style="margin-top:4px;width:20px;height:20px">` : ""}

            ${hint.has(p.id) ? `<div class="small" style="color:var(--ok);font-weight:600">✓ თანხა ემთხვევა ზედნადებს №${esc(hint.get(p.id).waybill_number)} (${dt(hint.get(p.id).wdate)})</div>` : ""}
            <div class="row" style="flex-wrap:wrap;margin-top:6px"><input type="text" class="nt grow" placeholder="კომენტარი" value="${esc(p.note || "")}" style="min-width:200px"><button class="btn ghost sm un">↩ ამოსაცნობში</button></div></div></div></div>`).join("")}`;
      const conf = sec.querySelector("#conf");
      const refresh = () => { if (!conf) return; const sel = [...sec.querySelectorAll(".ck:checked")]; conf.disabled = !sel.length;
        conf.textContent = `✓ მონიშნულების გატარება${sel.length ? ` (${sel.length} · ${money(sum(sel.map(c => rows.find(x => x.id == c.closest(".pay").dataset.id))))})` : ""}`; };
      sec.querySelectorAll(".pay").forEach(cd => { const p = rows.find(x => x.id == cd.dataset.id);
        cd.querySelector(".ck")?.addEventListener("change", refresh);
        cd.querySelector(".nt").onchange = async (e) => { try { await upd(p, { note: e.target.value.trim() || null }); toast("კომენტარი შენახულია"); } catch (err) { fail(err); } };
        cd.querySelector(".un").onclick = async () => { try { await upd(p, { customer_id: null, match_by: null }); hint.delete(p.id); draw(); } catch (e) { fail(e); } }; });

      sec.querySelector("#hintsel")?.addEventListener("click", () => { sec.querySelectorAll(".pay").forEach(cd => { const c = cd.querySelector(".ck"); if (c) c.checked = hint.has(Number(cd.dataset.id)); }); refresh(); });
      conf?.addEventListener("click", async () => {
        const ids = [...sec.querySelectorAll(".ck:checked")].map(c => Number(c.closest(".pay").dataset.id));
        const tot = sum(rows.filter(p => ids.includes(p.id)));

          toast(`გატარდა ${ids.length} გადახდა · ${money(tot)}`); LS.set("c:debts", null); reload(); } catch (e) { fail(e); conf.disabled = false; }
      });

    // unknown: say what it is — payment for goods (pick the outlet) or something else — and add a comment

        <div class="muted small" style="margin-top:4px">საქონლის საფასურისთვის აირჩიე ობიექტი — გადავა „ამოცნობილში“. სესხი, კაპიტალი და სხვა ვალს არ ეხება და „სხვა შემოსავალში“ ინახება.</div></div>
      ${unknown.map(p => `<div class="card pay unm" data-id="${p.id}"><div class="row" style="align-items:flex-start"><input type="checkbox" class="ck" style="margin-top:4px;width:20px;height:20px">
        <div class="grow">${head(p)}
          <div class="grid2" style="margin-top:6px"><div><label style="margin-top:0">დანიშნულება</label><select class="pp">${purposeOpts(p.purpose || "sale")}</select></div><div><label style="margin-top:0">კომენტარი</label><input type="text" class="nt" value="${esc(p.note || "")}" placeholder="მაგ. ნაღდი ექსპედიტორიდან, ავანსი"></div></div>
          <div class="cbox" style="margin-top:8px;${isSale(p) ? "" : "display:none"}"><label style="margin-top:0">ობიექტი / კომპანია</label>${custPicker(p)}</div>
          <div class="row" style="justify-content:flex-end;margin-top:8px">${isAdm() ? `<button class="btn ghost sm dl">🗑 წაშლა</button>` : ""}<button class="btn sm sv">შენახვა</button></div></div></div></div>`).join("")}`;
    const bgo = sec.querySelector("#bgo");
    const refresh = () => { bgo.disabled = !sec.querySelectorAll(".ck:checked").length; };
    sec.querySelectorAll(".pay").forEach(cd => { const p = rows.find(x => x.id == cd.dataset.id);
      wirePicker(cd, p); cd.querySelector(".ck").onchange = refresh;
      cd.querySelector(".pp").onchange = (e) => { cd.querySelector(".cbox").style.display = e.target.value === "sale" ? "" : "none"; };
      cd.querySelector(".dl")?.addEventListener("click", async () => { if (!(await ask(`${money(p.amount)} (${dt(p.paid_on)}) წაიშალოს?`, "წაშლა", true))) return; try { await q(sb.from("payments").delete().eq("id", p.id)); rows = rows.filter(x => x !== p); draw(); } catch (e) { fail(e); } });
      cd.querySelector(".sv").onclick = async (ev) => {
        const purpose = cd.querySelector(".pp").value, note = cd.querySelector(".nt").value.trim() || null, cid = Number(cd.querySelector(".cu").value) || null;
        if (purpose === "sale" && !cid) return toast("აირჩიე ობიექტი", true);
        ev.target.disabled = true;
        try {
          if (purpose === "sale") { await upd(p, { purpose, note, customer_id: cid, match_by: "ხელით" }); hint.delete(p.id); await loadHints(); toast("გადავიდა „ამოცნობილში“"); }
          else { await upd(p, { purpose, note, customer_id: null, match_by: null, status: "ignored" }); rows = rows.filter(x => x !== p); toast(`შენახულია: ${PURPOSE[purpose]}`); }
          draw();
        } catch (e) { fail(e); ev.target.disabled = false; }
      };
    });
    sec.querySelector("#all").onchange = (e) => { sec.querySelectorAll(".ck").forEach(c => c.checked = e.target.checked); refresh(); };
    bgo.onclick = async () => {
      const sel = [...sec.querySelectorAll(".ck:checked")].map(c => rows.find(x => x.id == c.closest(".pay").dataset.id)), purpose = sec.querySelector("#bp").value;
      if (!(await ask(`${sel.length} გადახდა (${money(sum(sel))}) მოინიშნოს როგორც „${PURPOSE[purpose]}“? ვალს არ შეეხება.`, "დიახ"))) return;
      bgo.disabled = true;
      try { await q(sb.from("payments").update({ purpose, status: "ignored", customer_id: null, match_by: null }).in("id", sel.map(p => p.id))); rows = rows.filter(x => !sel.includes(x)); toast(`გადავიდა „სხვა შემოსავალში“: ${sel.length}`); draw(); }
      catch (e) { fail(e); bgo.disabled = false; }
    };
  };
  main.querySelector("#qs").oninput = draw; draw();
}

async function paymentForm(customerId, onDone) {
  const mgr = ["admin", "manager"].includes(S.profile.role);
  let customers; try { customers = await customerList(); } catch (e) { return fail(e); }
  let src = "cash";
  modal(`<h3>გადახდის შეყვანა</h3>
    <div class="seg" style="margin:8px 0 2px"><button data-src="cash" class="on">💵 ნაღდი</button><button data-src="manual">🏦 ბანკით</button></div>
    <label>ობიექტი / კომპანია</label><input type="search" id="cs" placeholder="ძებნა: დასახელება ან ს/კ"><select id="cu" style="margin-top:6px">${custOpts(customers, customerId)}</select>
    <div class="grid2"><div><label>თანხა ₾</label><input type="number" id="am" min="0.01" step="0.01" inputmode="decimal"></div><div><label>თარიღი</label><input type="date" id="dd" value="${today()}"></div></div>
    <label>კომენტარი</label><input type="text" id="nt" placeholder="მაგ. ნაღდი ოფისში, ვინ მიიღო">
    ${mgr ? "" : `<div class="muted small" style="margin-top:8px">გადახდა გასატარებელში ჩაჯდება — მენეჯერი დაადასტურებს.</div>`}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-a="no">გაუქმება</button><button class="btn" data-a="ok">შენახვა</button></div>`,
    (m, close) => {
      m.querySelector('[data-a=no]').onclick = close;
      m.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { src = b.dataset.src; m.querySelectorAll("[data-src]").forEach(x => x.classList.toggle("on", x === b)); });
      const cu = m.querySelector("#cu");
      m.querySelector("#cs").oninput = (e) => { const s = norm(e.target.value); const keep = cu.value;
        cu.innerHTML = custOpts(customers.filter(c => !s || norm(custLabel(c)).includes(s)), keep); if (s && cu.options.length === 2) cu.selectedIndex = 1; };
      m.querySelector('[data-a=ok]').onclick = async (ev) => {
        const amount = Number(m.querySelector("#am").value), cid = Number(cu.value);
        if (!cid) return toast("აირჩიე ობიექტი", true);
        if (!(amount > 0)) return toast("მიუთითე თანხა", true);
        ev.target.disabled = true;
        try {
          await q(sb.from("payments").insert({ customer_id: cid, amount, paid_on: m.querySelector("#dd").value || today(), note: m.querySelector("#nt").value.trim() || null, source: src, purpose: "sale", status: mgr ? "confirmed" : "pending", match_by: "ხელით" }));
          toast(`${src === "cash" ? "ნაღდი " : ""}${mgr ? "გადახდა გატარდა — ვალს გამოაკლდა" : "გადახდა შენახულია — ელოდება დადასტურებას"}`); close(); onDone?.();
        } catch (e) { fail(e); ev.target.disabled = false; }
      };
    });
}

// bank statement: find columns, keep incoming money, match payer, save as "to post"
function bankImport(onDone) {
  const FIELDS = [["date", "თარიღი", /^თარიღ|^date|^დრო/i], ["credit", "შემოსავალი (ჩარიცხვა)", /შემოსავ|ჩარიცხ|credit|კრედიტ|incom|შემოსულ|მიღებ/i], ["debit", "გასავალი", /გასავ|ჩამოწ|debit|დებეტ|outgo/i],
    ["amount", "თანხა (ერთი სვეტი ±)", /^თანხა|amount|^sum|ოდენობ/i], ["payer_name", "გადამხდელი", /^პარტნიორი$|^partner'?s? name|გამგზავნის დასახელ|გადამხდელის დასახელ|^გადამხდელი|^გამგზავნი|payer|sender|კონტრაგ|კლიენტ/i],
    ["payer_tax_id", "გადამხდელის ს/კ", /საგადასახადო კოდ|საიდენტ|ს\/კ|tax code|inn|identif|პირადი/i], ["description", "დანიშნულება", /^დანიშნულ|ოპერაციის შინაარს|descr|purpose|დეტალ|comment|კომენტ/i], ["ref", "საბუთის ნომერი", /საბუთის ?(n|№|ნომ)|დოკუმენტის ?ნომ|document number|^reference|^ref$|ოპერაციის იდ/i]];
  let table = [], hi = -1, cols = {}, parsed = [];
  modal(`<h3>ბანკის ამონაწერი</h3><div class="muted small">ატვირთე ბანკიდან გადმოწერილი ექსელი (TBC, საქართველოს ბანკი, ლიბერთი…). პროგრამა აიღებს მხოლოდ შემოსულ თანხებს, ობიექტს ამოიცნობს ს/კ-ით ან დასახელებით და ჩასვამს „გასატარებელში“. ერთი და იგივე ფაილი ორჯერ არ ჩაიწერება.</div>
    <input type="file" id="f" accept=".xlsx,.xls,.csv" style="margin-top:10px"><div id="map"></div><div id="pv" style="margin-top:10px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-a="no">დახურვა</button><button class="btn" id="go" disabled>გასატარებელში ჩასმა</button></div>`,
    async (m, close) => {
      m.querySelector('[data-a=no]').onclick = close;
      const mapBox = m.querySelector("#map"), pv = m.querySelector("#pv"), go = m.querySelector("#go");
      const customers = await customerList().catch(() => []);
      const OWN_TIN = "406465686";
      const build = () => {
        const data = table.slice(hi + 1);
        parsed = [];
        data.forEach(r => {
          const get = (k) => cols[k] >= 0 ? r[cols[k]] : null;
          let amt = toNum(get("credit"));
          if (cols.credit < 0 && cols.amount >= 0) amt = toNum(get("amount"));
          if (!(amt > 0)) return;
          const date = toDate(get("date")); if (!date) return;
          const row = { paid_on: date, amount: Math.round(amt * 100) / 100, payer_name: get("payer_name") ? String(get("payer_name")).trim() : null,
            payer_tax_id: get("payer_tax_id") ? String(get("payer_tax_id")).replace(/\D/g, "") || null : null, description: get("description") ? String(get("description")).trim() : null, ref: get("ref") ? String(get("ref")).trim() : null };
          if (row.payer_tax_id === OWN_TIN || /ელ თი ზი 2024/.test(row.payer_name || "")) return;   // own transfers between accounts
          const d0 = row.description || "";
          const purpose = /სესხ|loan/i.test(d0) ? "loan" : /კაპიტალ|capital|შენატან/i.test(d0) ? "capital" : /კონვერტაც/i.test(d0) ? "own" : "sale";   // loans etc. are not payment for goods
          const [c, by] = purpose !== "sale" ? [null, null] : matchPayer(row, customers);
          parsed.push({ ...row, purpose, customer_id: c?.id ?? null, match_by: by, _c: c });
        });
        const matched = parsed.filter(p => p.customer_id).length;
        pv.innerHTML = parsed.length ? `<div class="card" style="background:var(--brand-soft);border-color:transparent">შემოსული <b>${parsed.length}</b> გადახდა · <b>${money(parsed.reduce((a, p) => a + p.amount, 0))}</b> · ამოცნობილი <b>${matched}</b>, ამოსაცნობი <b>${parsed.length - matched}</b></div>
          <div style="max-height:260px;overflow:auto"><table><thead><tr><th>თარიღი</th><th>გადამხდელი</th><th class="right">თანხა</th><th>ობიექტი</th></tr></thead><tbody>
          ${parsed.slice(0, 200).map(p => `<tr><td class="num">${dt(p.paid_on)}</td><td><div class="ell" style="max-width:220px">${esc(p.payer_name || "")}</div><div class="small muted">${esc(p.payer_tax_id || "")}</div></td><td class="right num">${money(p.amount)}</td>
            <td class="small">${p._c ? `<span style="color:var(--ok)">✓ ${esc(p._c.network || p._c.name)}</span>` : `<span style="color:var(--warn)">ამოსაცნობი</span>`}</td></tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">შემოსული თანხა ვერ ვიპოვე — შეამოწმე სვეტები ზემოთ</div>`;
        go.disabled = !parsed.length;
      };
      const drawMap = () => {
        const hdr = (table[hi] || []).map((v, i) => [i, String(v ?? `სვეტი ${i + 1}`)]);
        mapBox.innerHTML = `<details style="margin-top:10px" ${FIELDS.slice(0, 2).some(([k]) => cols[k] < 0) ? "open" : ""}><summary class="small">სვეტების შესაბამისობა (თუ რამე არასწორადაა, შეცვალე)</summary>
          <div class="grid2">${FIELDS.map(([k, l]) => `<div><label>${l}</label><select data-k="${k}"><option value="-1">—</option>${hdr.map(([i, n]) => `<option value="${i}" ${cols[k] === i ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`).join("")}</div></details>`;
        mapBox.querySelectorAll("select").forEach(s => s.onchange = () => { cols[s.dataset.k] = Number(s.value); build(); });
      };
      m.querySelector("#f").onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        pv.innerHTML = loading(); go.disabled = true;
        try {
          // every sheet with a recognizable header; foreign-currency sheets are skipped (customers pay in GEL)
          const book = (await readBook(file)).filter(sh => !/USD|EUR|GBP|CNY|RUB/i.test(sh.name));
          const found = [];
          book.forEach(sh => { const rows = sh.rows.filter(r => r && r.some(v => v != null && v !== "")); let best = -1, bestN = 0;
            rows.slice(0, 40).forEach((r, i) => { const n = FIELDS.filter(([, , re]) => r.some(v => typeof v === "string" && re.test(v.trim()))).length; if (n > bestN) { best = i; bestN = n; } });
            if (bestN >= 3) found.push({ rows, hi: best }); });
          if (!found.length) throw new Error("სათაურების სტრიქონი ვერ ვიპოვე — ეს ბანკის ამონაწერია?");
          // same layout on every sheet → glue them under the first header
          hi = found[0].hi; table = [...found[0].rows.slice(0, hi + 1), ...found.flatMap(f => f.rows.slice(f.hi + 1))];
          cols = {};
          const used = new Set();
          FIELDS.forEach(([k, , re]) => { const i = table[hi].findIndex((v, j) => !used.has(j) && typeof v === "string" && re.test(v.trim())); cols[k] = i; if (i >= 0) used.add(i); });
          drawMap(); build();
        } catch (err) { pv.innerHTML = `<div class="small" style="color:var(--bad)">${esc(err.message)}</div>`; }
      };
      go.onclick = async () => {
        go.disabled = true;
        try {
          const hash = async (s) => { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 32); } catch { let h1 = 0; for (const ch of s) h1 = (h1 * 31 + ch.charCodeAt(0)) | 0; return "h" + h1 + "_" + s.length; } };
          const seen = new Map();
          const rows = [];
          for (const p of parsed) {
            const base = [p.paid_on, p.amount.toFixed(2), p.payer_tax_id || "", nameKey(p.payer_name), nameKey(p.description), p.ref || ""].join("|");
            const n = (seen.get(base) || 0) + 1; seen.set(base, n);           // same line twice in one file stays two payments
            rows.push({ paid_on: p.paid_on, amount: p.amount, payer_name: p.payer_name, payer_tax_id: p.payer_tax_id, description: p.description,
              customer_id: p.customer_id, match_by: p.match_by, purpose: p.purpose || "sale", source: "bank", status: "pending", bank_ref: await hash(base + "|" + n) });
          }
          let added = 0;
          for (let i = 0; i < rows.length; i += 500) { const r = await q(sb.from("payments").upsert(rows.slice(i, i + 500), { onConflict: "bank_ref", ignoreDuplicates: true }).select("id")); added += r.length; }
          close(); toast(`ჩაემატა ${added} გადახდა${rows.length - added ? ` · უკვე იყო ${rows.length - added}` : ""}`); S.cache.payFilter = "pending"; onDone?.();
        } catch (e) { fail(e); go.disabled = false; }
      };
    });
}

async function nbgRate(cur, date) {

async function rsPurchasePicker(main) {
  let rows; try { rows = await q(sb.rpc("rs_bought_open")); } catch (e) { return fail(e); }
  modal(`<div class="row"><h3 class="grow">შიდა შესყიდვა RS-დან</h3><button class="btn ghost sm" data-a="x">✕</button></div>
    <div class="muted small">RS-ზე შენზე გამოწერილი ზედნადებები, რომლებიც ჯერ არ არის შეყვანილი. აირჩიე — მომწოდებელი და პოზიციები თავისით ჩაიწერება, შემდეგ მიაბამ გადახდას და მიიღებ საწყობში.</div>
    <input type="search" id="qs" placeholder="ძებნა: მომწოდებელი, ნომენკლატურა" style="margin-top:8px"><div id="ls" class="list" style="margin-top:6px"></div>`, (m, close) => {
    m.querySelector('[data-a=x]').onclick = close;
    const draw = () => { const s = norm(m.querySelector("#qs").value);
      const r = rows.filter(x => !s || norm([x.name, x.items, x.tin, x.waybill_number].join(" ")).includes(s));
      m.querySelector("#ls").innerHTML = r.map(x => `<div class="item click" data-w="${x.waybill_id}"><div class="grow"><b>${esc(x.name)}</b> <span class="muted small">ს/კ ${esc(x.tin)}</span><div class="small muted">№${esc(x.waybill_number)} · ${dt(x.d)}</div><div class="small ell" style="max-width:520px">${esc(x.items || "")}</div></div><b class="num">${money(x.amount)}</b></div>`).join("") || `<div class="empty">ახალი ზედნადები არ არის</div>`;
      m.querySelectorAll(".item[data-w]").forEach(it => it.onclick = async () => { try { const id = await q(sb.rpc("local_purchase_from_rs", { p_waybill: Number(it.dataset.w) })); close(); importEditor(main, id); } catch (e) { fail(e); } }); };
    m.querySelector("#qs").oninput = draw; draw();
  });
}

async function salesDrill(filter, title, views, d1, d2) {
  let res;

const FIN_GRP = { operating: "საოპერაციო", investing: "საინვესტიციო", financing: "ფინანსური", neutral: "შიდა გადატანები" };
// both TBC (one sheet per account) and Bank of Georgia statements → plain rows
async function finParse(file) {
  const book = await readBook(file), out = [], seen = new Map();
  const T = (v) => String(v ?? "").replace(/\s+/g, " ").trim();
  for (const sh of book) {
    const rows = sh.rows;
    const hi = rows.slice(0, 40).findIndex(r => r.some(v => /^(თარიღი|date)$/i.test(T(v))) && r.some(v => /შემოსული თანხა|^კრედიტი$|paid in|^credit$/i.test(T(v))));
    if (hi < 0) continue;
    const h0 = rows[hi].map(T), col = (re) => h0.findIndex(v => re.test(v));
    const c = { d: col(/^(თარიღი|date)$/i), out: col(/გასული თანხა|^დებეტი$|^paid out$|^debit$/i), inn: col(/შემოსული თანხა|^კრედიტი$|^paid in$|^credit$/i),
      desc: col(/^დანიშნულება$|^description$/i), content: col(/ოპერაციის შინაარსი/i), info: col(/დამატებითი ინფორმაცია/i), type: col(/ტრანზაქციის ტიპი|ოპერაციის ტიპი|^type$/i),
      doc: col(/საბუთის (№|n)|document number/i), partner: col(/^პარტნიორი$|partner'?s name/i), ptax: col(/პარტნიორის საგადასახადო კოდი|partner'?s tax/i), pacc: col(/პარტნიორის ანგარიში|მოკორესპოდენტო ანგარიში|partner'?s account/i),
      sname: col(/გამგზავნის დასახელება/i), stax: col(/გამგზავნის საიდენტიფიკაციო კოდი/i), rname: col(/მიმღების დასახელება/i), rtax: col(/მიმღების საიდენტიფიკაციო კოდი/i), acc: col(/^ანგარიში$/i) };
    // account: per row (BoG) or from the sheet name "GE90TB…-GEL" / header area (TBC)
    const sm = /^(GE\w{18,22})-?([A-Z]{3})?$/.exec(sh.name.trim());
    let sheetIban = sm?.[1], sheetCur = sm?.[2];
    if (!sheetIban) rows.slice(0, hi).forEach(r => r.forEach(v => { const m = /(GE\d{2}[A-Z]{2}\d{14,16})([A-Z]{3})?/.exec(T(v)); if (m && !sheetIban) { sheetIban = m[1]; sheetCur = m[2]; } }));
    for (const r of rows.slice(hi + 1)) {
      const d = toDate(r[c.d]); if (!d || !/^\d{4}-/.test(d)) continue;
      const amt = Math.round(((toNum(r[c.inn]) || 0) - (toNum(r[c.out]) || 0)) * 100) / 100; if (!amt) continue;
      let iban = c.acc >= 0 ? T(r[c.acc]) : sheetIban; if (!iban) continue;
      const cm = /^(GE\w+?)(GEL|USD|EUR|GBP|CNY)$/.exec(iban); const cur = cm ? cm[2] : (sheetCur || "GEL");
      const ibanKey = cm ? iban : iban + cur;
      const bank = /TB/.test(iban) ? "TBC" : /BG/.test(iban) ? "BOG" : "BANK";
      const desc = T(c.desc >= 0 ? r[c.desc] : r[c.content]) || T(r[c.content]);
      const info = c.info >= 0 ? T(r[c.info]) : (c.content >= 0 && T(r[c.content]) !== desc ? T(r[c.content]) : "");
      const partner = c.partner >= 0 ? T(r[c.partner]) : T(amt > 0 ? r[c.sname] : r[c.rname]);
      const ptax = c.ptax >= 0 ? T(r[c.ptax]) : T(amt > 0 ? r[c.stax] : r[c.rtax]);
      const doc = T(r[c.doc]);
      const key = [ibanKey, d, amt, doc, desc].join("|"), n = (seen.get(key) || 0) + 1; seen.set(key, n);
      out.push({ bank, iban: ibanKey, cur, d, amount: amt, desc: desc.slice(0, 500), info: info.slice(0, 300), partner: partner.slice(0, 200), ptax, pacc: T(r[c.pacc]), doc, type: T(r[c.type]), n: n > 1 ? String(n) : "" });
    }
  }
  return out;
}

function finUpload(onDone) {
  let rows = [];
  modal(`<h3>ბანკის ამონაწერის ატვირთვა</h3><div class="muted small">თიბისი და საქართველოს ბანკის ექსელი — ყველა ანგარიში და ვალუტა ერთად. დოლარის ოპერაციებს ეროვნული ბანკის კურსი დაეწერება. უკვე ატვირთული ოპერაციები ორჯერ არ ჩაიწერება; კლიენტების გადახდები „გადახდებში“ უკვე არსებულს დაუკავშირდება ან „გასატარებელში“ ჩაჯდება.</div>
    <input type="file" id="f" accept=".xlsx,.xls" style="margin-top:10px"><div id="pv" style="margin-top:10px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-a="no">დახურვა</button><button class="btn" id="go" disabled>ატვირთვა</button></div>`, (m, close) => {
    m.querySelector('[data-a=no]').onclick = close;
    const pv = m.querySelector("#pv"), go = m.querySelector("#go");
    m.querySelector("#f").onchange = async (e) => { const file = e.target.files[0]; if (!file) return; pv.innerHTML = loading(); go.disabled = true;
      try { rows = await finParse(file); if (!rows.length) throw new Error("ოპერაციები ვერ ვიპოვე — ეს ბანკის ამონაწერია?");
        const accs = [...new Set(rows.map(r => r.iban))], fx = rows.filter(r => r.cur !== "GEL");
        pv.innerHTML = `<div class="card" style="background:var(--brand-soft);border-color:transparent"><b>${rows.length}</b> ოპერაცია · ${accs.length} ანგარიში (${accs.map(a => "…" + a.slice(-8)).join(", ")}) · ${dt(rows.map(r => r.d).sort()[0])} — ${dt(rows.map(r => r.d).sort().pop())}
          <div class="small">შემოსვლა ${qtyf(rows.filter(r => r.amount > 0).length)} · გასვლა ${qtyf(rows.filter(r => r.amount < 0).length)}${fx.length ? ` · ვალუტაში ${fx.length} (კურსი ჩაიწერება)` : ""}</div></div>`;
        go.disabled = false; } catch (err) { pv.innerHTML = `<div class="small" style="color:var(--bad)">${esc(err.message)}</div>`; } };
    go.onclick = async () => { go.disabled = true;
      try {
        const fx = [...new Set(rows.filter(r => r.cur !== "GEL").map(r => r.cur + "|" + r.d))];
        for (let i = 0; i < fx.length; i++) { const [c, d] = fx[i].split("|"); go.textContent = `კურსები ${i + 1}/${fx.length}…`; const rt = await nbgRate(c, d); if (!rt) throw new Error(`ეროვნული ბანკის კურსი ვერ ჩამოვტვირთე (${c} ${d}) — სცადე ხელახლა`); rows.filter(r => r.cur === c && r.d === d).forEach(r => r.rate = rt); }
        let tot = { new: 0, dup: 0, payments: 0 };
        for (let i = 0; i < rows.length; i += 150) { go.textContent = `ატვირთვა ${Math.min(i + 150, rows.length)}/${rows.length}…`; const r = await q(sb.rpc("fin_import", { p_rows: rows.slice(i, i + 150) })); tot.new += r.new; tot.dup += r.dup; tot.payments += r.payments; }
        close(); toast(`ჩაიწერა ${tot.new} ოპერაცია${tot.dup ? ` · უკვე იყო ${tot.dup}` : ""}${tot.payments ? ` · „გასატარებელში“ ჩაჯდა ${tot.payments} გადახდა` : ""}`); onDone?.();
      } catch (e) { fail(e); go.disabled = false; go.textContent = "ატვირთვა"; } };
  });
}

const INV_SCOPE = { all: "ყველა პროდუქტი", stock: "მხოლოდ ნაშთიანი", category: "კატეგორია", empty: "ცარიელი — სკანირებით ვამატებ" };
const INV_ST = { open: ["მიმდინარე", "s-confirmed"], done: ["დასრულებული", "s-delivered"], cancelled: ["გაუქმებული", "s-cancelled"] };
const invMgr = () => ["admin", "manager"].includes(S.profile.role);
const sgn = (n) => (n > 0 ? "+" : "") + qtyf(n);

async function viewInventory(main) {
  main.innerHTML = `<div class="ph"><div class="grow"><h2>ინვენტარიზაცია</h2><div class="muted">დათვალე საწყობი, შეადარე პროგრამის ნაშთს და ერთი ღილაკით გაასწორე</div></div>
      <button class="btn" id="new">＋ ახალი ინვენტარიზაცია</button></div><div id="rsx"></div><div id="list">${loading()}</div>`;
  main.querySelector("#new").onclick = () => invNew(main);
  rsStockBox(main.querySelector("#rsx"), () => viewInventory(main));
  let rows, lines = [];
  try {
    rows = await cq("inv:list", () => q(sb.from("inv_counts").select("id, title, status, scope, blind, note, created_at, finished_at, summary, category:categories(name), creator:profiles!inv_counts_created_by_fkey(full_name)").order("created_at", { ascending: false }).limit(60)));
    const open = rows.filter(r => r.status === "open").map(r => r.id);
    if (open.length) lines = await cq("inv:prog", async () => { const all = []; for (let f = 0; ; f += 1000) { const r = await q(sb.from("inv_count_lines").select("count_id, counted_qty, system_qty").in("count_id", open).range(f, f + 999)); all.push(...r); if (r.length < 1000) break; } return all; });
  } catch (e) { main.querySelector("#list").innerHTML = ""; return fail(e); }
  const list = main.querySelector("#list");
  if (!rows.length) { list.innerHTML = `<div class="card empty-state"><div class="es-ic">${ICON.inventory}</div><h3>ჯერ ინვენტარიზაცია არ ჩატარებულა</h3><p class="muted">შექმენი პირველი — პროგრამა ავტომატურად ჩასვამს ყველა პროდუქტს და მის მიმდინარე ნაშთს.</p><button class="btn" id="new2">＋ ახალი ინვენტარიზაცია</button></div>`; list.querySelector("#new2").onclick = () => invNew(main); return; }
  const card = (r) => {
    const ls = lines.filter(l => l.count_id === r.id), done = ls.filter(l => l.counted_qty != null).length, pct = ls.length ? Math.round(done / ls.length * 100) : 0;
    const dif = ls.filter(l => l.counted_qty != null && Number(l.counted_qty) !== Number(l.system_qty)).length;
    const sm = r.summary || {};
    return `<div class="card inv-card click" data-id="${r.id}">
      <div class="row"><div class="grow"><div class="inv-t">${esc(r.title)}</div>
        <div class="muted small">${dt(r.created_at)} · ${esc(r.creator?.full_name || "")} · ${esc(INV_SCOPE[r.scope] || r.scope)}${r.category?.name ? ": " + esc(r.category.name) : ""}${r.blind ? " · ბრმა დათვლა" : ""}</div></div>
        <span class="badge ${INV_ST[r.status][1]}">${INV_ST[r.status][0]}</span></div>
      ${r.status === "open" ? `<div class="progress"><div style="width:${pct}%"></div></div>
        <div class="row small"><span><b>${done}</b> / ${ls.length} დათვლილი (${pct}%)</span><span class="grow"></span>${dif ? `<span class="pill warn">${dif} სხვაობით</span>` : ""}</div>`
      : r.status === "done" ? `<div class="inv-sum"><span>დათვლილი <b>${qtyf(sm.counted ?? 0)}</b></span><span>გასწორდა <b>${qtyf(sm.adjusted ?? 0)}</b></span>${sm.uncounted ? `<span class="pill warn">${sm.uncounted} დაუთვლელი — უცვლელი</span>` : ""}
        <span class="neg">ნაკლი <b>${qtyf(sm.short_qty ?? 0)}</b> ც${sm.short_value ? ` · ${money(sm.short_value)}` : ""}</span><span class="pos">ზედმეტი <b>${qtyf(sm.surplus_qty ?? 0)}</b> ც${sm.surplus_value ? ` · ${money(sm.surplus_value)}` : ""}</span></div>` : ""}
    </div>`;
  };
  const open = rows.filter(r => r.status === "open"), hist = rows.filter(r => r.status !== "open");
  list.innerHTML = (open.length ? `<div class="sec-t">მიმდინარე</div>${open.map(card).join("")}` : "") + (hist.length ? `<div class="sec-t">ისტორია</div>${hist.map(card).join("")}` : "");
  list.querySelectorAll(".inv-card").forEach(c => c.onclick = () => invScreen(main, Number(c.dataset.id)));
}

async function invLoad(id) {
  const head = await cq("inv:h:" + id, () => q(sb.from("inv_counts").select("id, title, status, scope, blind, note, created_at, finished_at, summary, uncounted, creator:profiles!inv_counts_created_by_fkey(full_name)").eq("id", id).single()));
  const lines = await cq("inv:l:" + id, async () => { const all = []; for (let f = 0; ; f += 1000) { const r = await q(sb.from("inv_count_lines").select("id, product_id, system_qty, counted_qty, unit_cost, final_system, adj_qty, counted_at, product:products(code, name, barcode, image_url, category_id, cost)").eq("count_id", id).order("id").range(f, f + 999)); all.push(...r); if (r.length < 1000) break; } return all; });
  // edits made on this device that are still waiting in the outbox
  outbox.all().filter(o => o.type === "inv_set" && o.count_id === id).forEach(o => { const l = lines.find(x => x.id === o.line_id); if (l) l.counted_qty = o.qty; });
  return { head, lines };
}

async function invScreen(main, id) {
  document.querySelectorAll(".bar").forEach(b => b.remove());
  main.innerHTML = loading();
  let head, lines, cats = [];
  try { ({ head, lines } = await invLoad(id)); cats = await cq("cats", () => q(sb.from("categories").select("id, name, sort").order("sort"))).catch(() => []); }
  catch (e) { main.innerHTML = ""; return fail(e); }
  lines.sort((a, b) => byCode(a.product, b.product));
  const open = head.status === "open", mgr = invMgr();
  let showSys = !head.blind || (mgr && LS.get("inv:sys:" + id, false));
  let filter = "all", cat = "", qs = "", mode = LS.get("inv:mode", "set"), limit = 150, flash = null;
  const catName = (cid) => cats.find(c => c.id === cid)?.name || "";
  const cost = (l) => Number(l.unit_cost ?? l.product?.cost ?? 0);
  const sysOf = (l) => Number(open ? l.system_qty : (l.final_system ?? l.system_qty));
  const diffOf = (l) => !open && l.adj_qty != null && (l.counted_qty != null || Number(l.adj_qty) !== 0) ? Number(l.adj_qty) : l.counted_qty == null ? null : Number(l.counted_qty) - sysOf(l);
  const save = () => LS.set("c:inv:l:" + id, lines);
  const hasCost = lines.some(l => cost(l) > 0);

  main.innerHTML = `<div class="ph"><button class="btn ghost sm" id="back">← სია</button><div class="grow"><h2 style="margin:0">${esc(head.title)}</h2>
      <div class="muted small">${dt(head.created_at)} · ${esc(head.creator?.full_name || "")}${head.note ? " · " + esc(head.note) : ""}</div></div>
      <span class="badge ${INV_ST[head.status][1]}">${INV_ST[head.status][0]}</span></div>
    ${!open && lines.some(l => l.counted_qty == null) ? `<div class="warnbox" style="margin-bottom:12px"><div class="row"><div class="grow"><b>⚠ ${lines.filter(l => l.counted_qty == null).length} პოზიცია არ დათვლილა</b> — მათი ნაშთი უცვლელი დარჩა</div><button class="btn ghost sm" id="seeu">ნახვა</button></div></div>` : ""}
    <div class="kpis" id="kp"></div>
    ${open ? `<div class="card scan-card"><div class="scan-row"><div class="scan-in"><span class="scan-ic">${ICON.scan}</span><input type="search" id="scan" inputmode="search" autocomplete="off" placeholder="დაასკანერე ბარკოდი ან ჩაწერე კოდი (მაგ. 124) და Enter"></div>
        <div class="seg"><button data-md="set" class="${mode === "set" ? "on" : ""}" title="იპოვის პროდუქტს და რაოდენობის ველზე გადაგიყვანს">✎ რაოდენობა</button><button data-md="inc" class="${mode === "inc" ? "on" : ""}" title="ყოველი სკანირება +1">＋1 სკანზე</button></div></div>
        <div id="scanmsg" class="small muted" style="margin-top:6px">${mode === "inc" ? "ყოველი სკანირება დათვლილს 1-ით ზრდის" : "Enter → რაოდენობის ველი; ჩაწერე და ისევ Enter"}</div></div>` : ""}
    <div class="toolbar"><div class="chips" id="fl" style="margin:0"></div><div class="grow"></div>
      <select id="cf" style="max-width:200px"><option value="">ყველა კატეგორია</option>${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
      <input type="search" id="qs" placeholder="ძებნა" style="max-width:180px">
      ${head.blind && mgr ? `<label class="check sm"><input type="checkbox" id="ss" ${showSys ? "checked" : ""}> ნაშთის ჩვენება</label>` : ""}</div>
    <div class="card" style="padding:0;overflow:hidden"><div id="ls" class="inv-list"></div></div>`;
  main.querySelector("#back").onclick = () => { document.querySelectorAll(".bar").forEach(b => b.remove()); viewInventory(main); };

  const kpis = () => {
    const done = lines.filter(l => l.counted_qty != null), pct = lines.length ? Math.round(done.length / lines.length * 100) : 0;
    let sq = 0, sv = 0, pq = 0, pv = 0, mism = 0;
    done.forEach(l => { const d = diffOf(l); if (d < 0) { sq -= d; sv -= d * cost(l); mism++; } else if (d > 0) { pq += d; pv += d * cost(l); mism++; } });
    const vis = showSys || !open;
    main.querySelector("#kp").innerHTML = `
      <div class="card kpi"><div class="muted">დათვლილი</div><div class="v">${done.length}<span class="muted" style="font-size:14px;font-weight:500"> / ${lines.length}</span></div><div class="progress" style="margin:6px 0 0"><div style="width:${pct}%"></div></div></div>
      <div class="card kpi"><div class="muted">დათვლილი ცალი</div><div class="v">${qtyf(done.reduce((a, l) => a + Number(l.counted_qty), 0))}</div>${vis ? `<div class="small muted">პროგრამით ${qtyf(done.reduce((a, l) => a + sysOf(l), 0))}</div>` : ""}</div>
      ${vis ? `<div class="card kpi"><div class="muted">ნაკლი</div><div class="v neg">${qtyf(sq)} <span style="font-size:13px">ც</span></div><div class="small muted">${hasCost ? money(sv) : "თვითღირებულება ჯერ არ არის"}</div></div>
      <div class="card kpi"><div class="muted">ზედმეტი</div><div class="v pos">${qtyf(pq)} <span style="font-size:13px">ც</span></div><div class="small muted">${hasCost ? money(pv) : `${mism} პოზიცია სხვაობით`}</div></div>` : `<div class="card kpi"><div class="muted">ბრმა დათვლა</div><div class="small muted" style="margin-top:6px">სხვაობა გამოჩნდება დასრულებისას</div></div>`}`;
  };

  const FL = [["all", "ყველა"], ["todo", "დაუთვლელი"], ["done", "დათვლილი"], ...(showSys || !open ? [["diff", "სხვაობით"], ["short", "ნაკლი"], ["surplus", "ზედმეტი"]] : [])];
  const drawFilters = () => {
    const n = (k) => lines.filter(l => pass(l, k)).length;
    main.querySelector("#fl").innerHTML = FL.map(([k, v]) => `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${v} <span class="cn">${n(k)}</span></button>`).join("");
    main.querySelectorAll("#fl .chip").forEach(c => c.onclick = () => { filter = c.dataset.f; limit = 150; draw(); });
  };
  const pass = (l, f = filter) => { const d = diffOf(l);
    return f === "all" || (f === "todo" && l.counted_qty == null) || (f === "done" && l.counted_qty != null) || (f === "diff" && d != null && d !== 0) || (f === "short" && d < 0) || (f === "surplus" && d > 0); };
  const rowHtml = (l) => {
    const p = l.product || {}, d = diffOf(l), vis = showSys || !open;
    const dcls = d == null ? "" : d === 0 ? "ok" : d < 0 ? "bad" : "info";
    return `<div class="inv-row ${l.counted_qty != null ? "counted" : !open ? "uncounted" : ""} ${flash === l.id ? "flash" : ""}" data-id="${l.id}">
      ${imgTag(p, 44)}
      <div class="grow" style="min-width:0"><div class="row" style="gap:8px"><b class="code">${esc(p.code)}</b>${p.barcode ? `<span class="muted small ell">${esc(p.barcode)}</span>` : ""}</div>
        <div class="ell small">${esc(p.name)}</div><div class="muted small ell">${esc(catName(p.category_id))}</div></div>
      ${vis ? `<div class="inv-sys"><span class="muted small">პროგრამით</span><b>${qtyf(sysOf(l))}</b></div>` : ""}
      ${open ? `<div class="qty inv-q"><button class="mn" tabindex="-1">−</button><input type="number" inputmode="decimal" min="0" step="any" value="${l.counted_qty ?? ""}" placeholder="—"><button class="pl" tabindex="-1">＋</button></div>`
        : `<div class="inv-sys"><span class="muted small">დათვლილი</span><b>${l.counted_qty == null ? "—" : qtyf(l.counted_qty)}</b></div>`}
      <div class="inv-d">${!open && l.counted_qty == null ? `<span class="pill warn" title="ნაშთი უცვლელი დარჩა">არ დათვლილა</span>` : vis && d != null ? `<span class="pill ${dcls}">${d === 0 ? "✓" : sgn(d)}</span>${d && cost(l) ? `<div class="small muted">${money(d * cost(l))}</div>` : ""}` : l.counted_qty != null ? `<span class="pill ok">✓</span>` : ""}</div>
    </div>`;
  };
  const setQty = (l, v, fromScan = false) => {
    const nv = v === "" || v == null ? null : Math.max(0, Number(v));
    if (nv != null && isNaN(nv)) return;
    if (nv === (l.counted_qty == null ? null : Number(l.counted_qty))) return;
    l.counted_qty = nv; l.counted_at = new Date().toISOString(); save();
    act({ type: "inv_set", count_id: id, line_id: l.id, qty: nv, label: `${l.product?.code}: ${nv ?? "—"}` }).catch(fail);
    const el = main.querySelector(`.inv-row[data-id="${l.id}"]`);
    if (el) { const tmp = h(rowHtml(l)); el.replaceWith(tmp); wireRow(tmp); if (fromScan) { tmp.classList.add("flash"); setTimeout(() => tmp.classList.remove("flash"), 900); } }
    kpis(); drawFilters();
  };
  const wireRow = (el) => {
    if (!open) return;
    const l = lines.find(x => x.id == el.dataset.id), inp = el.querySelector("input");
    let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(() => setQty(l, inp.value), 700); };
    inp.onchange = () => { clearTimeout(t); setQty(l, inp.value); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(t); setQty(l, inp.value); main.querySelector("#scan")?.focus(); main.querySelector("#scan")?.select(); } };
    inp.onfocus = () => inp.select();
    el.querySelector(".mn").onclick = () => setQty(l, Math.max(0, Number(l.counted_qty || 0) - 1));
    el.querySelector(".pl").onclick = () => setQty(l, Number(l.counted_qty || 0) + 1);
  };
  const draw = () => {
    const s = norm(qs);
    const r = lines.filter(l => pass(l) && (!cat || String(l.product?.category_id) === cat) && (!s || norm([l.product?.code, l.product?.name, l.product?.barcode].join(" ")).includes(s)));
    const ls = main.querySelector("#ls");
    ls.innerHTML = r.slice(0, limit).map(rowHtml).join("") + (r.length > limit ? `<div class="more"><button class="btn ghost sm" id="more">კიდევ ${Math.min(150, r.length - limit)} (სულ ${r.length})</button></div>` : "") || `<div class="empty">${lines.length ? "ამ ფილტრით არაფერია" : "სია ცარიელია — დაასკანერე პროდუქტი"}</div>`;
    ls.querySelectorAll(".inv-row").forEach(wireRow);
    ls.querySelector("#more")?.addEventListener("click", () => { limit += 150; draw(); });
    drawFilters(); kpis();
  };
  main.querySelector("#seeu")?.addEventListener("click", () => { filter = "todo"; limit = 150; draw(); });
  main.querySelector("#cf").onchange = (e) => { cat = e.target.value; limit = 150; draw(); };
  main.querySelector("#qs").oninput = (e) => { qs = e.target.value; limit = 150; draw(); };
  main.querySelector("#ss")?.addEventListener("change", (e) => { LS.set("inv:sys:" + id, e.target.checked); invScreen(main, id); });

  // scanning: barcode → code → "124" → BH-124
  const findLine = (raw) => {
    const t = String(raw || "").trim(); if (!t) return null;
    const pc = parseCode(t), nb = t.replace(/\s/g, "");
    return lines.find(l => l.product?.barcode && String(l.product.barcode).replace(/\s/g, "") === nb) || lines.find(l => String(l.product?.code).toUpperCase() === pc) || null;
  };
  const scan = main.querySelector("#scan");
  if (scan) {
    const msg = (t, err) => { const m = main.querySelector("#scanmsg"); m.innerHTML = t; m.style.color = err ? "var(--bad)" : ""; };
    main.querySelectorAll("[data-md]").forEach(b => b.onclick = () => { mode = b.dataset.md; LS.set("inv:mode", mode); main.querySelectorAll("[data-md]").forEach(x => x.classList.toggle("on", x === b)); msg(mode === "inc" ? "ყოველი სკანირება დათვლილს 1-ით ზრდის" : "Enter → რაოდენობის ველი; ჩაწერე და ისევ Enter"); scan.focus(); });
    scan.onkeydown = async (e) => {
      if (e.key !== "Enter") return; e.preventDefault();
      const v = scan.value; let l = findLine(v);
      if (!l) {
        const all = LS.get("c:products:all") || LS.get("c:products") || [];
        const pc = parseCode(v), p = all.find(x => (x.barcode && String(x.barcode).replace(/\s/g, "") === v.replace(/\s/g, "")) || String(x.code).toUpperCase() === pc);
        if (!p) { msg(`„${esc(v)}“ — ასეთი პროდუქტი ვერ ვიპოვე`, true); scan.select(); return; }
        if (!navigator.onLine) { msg(`${esc(p.code)} ამ სიაში არ არის — დასამატებლად ინტერნეტია საჭირო`, true); return; }
        try { const lid = await q(sb.rpc("inv_count_add", { p_count: id, p_product: p.id }));
          const nl = (await q(sb.from("inv_count_lines").select("id, product_id, system_qty, counted_qty, unit_cost, final_system, adj_qty, counted_at, product:products(code, name, barcode, image_url, category_id, cost)").eq("id", lid)))[0];
          lines.push(nl); lines.sort((a, b) => byCode(a.product, b.product)); save(); l = nl; msg(`${esc(p.code)} დაემატა სიას`);
        } catch (er) { return fail(er); }
      }
      filter = "all"; cat = ""; qs = ""; main.querySelector("#cf").value = ""; main.querySelector("#qs").value = "";
      const idx = lines.indexOf(l); if (idx >= limit) limit = idx + 20;
      flash = l.id; draw(); flash = null;
      const el = main.querySelector(`.inv-row[data-id="${l.id}"]`); el?.scrollIntoView({ block: "center", behavior: "smooth" });
      if (mode === "inc") { setQty(l, Number(l.counted_qty || 0) + 1, true); msg(`<b>${esc(l.product.code)}</b> — დათვლილი ${qtyf(l.counted_qty)}`); scan.value = ""; scan.focus(); }
      else { msg(`<b>${esc(l.product.code)}</b> ${esc(l.product.name)} — ჩაწერე რაოდენობა და Enter`); const inp = el?.querySelector("input"); inp?.focus(); scan.value = ""; }
    };
    setTimeout(() => scan.focus(), 50);
  }

  // bottom bar
  const bar = h(`<div class="bar inv-bar">${XBTN}${open ? `<button class="btn ghost sm" id="xin">📥 ექსელიდან</button>` : ""}<button class="btn ghost sm" id="pr">🖨 დასაბეჭდი</button><div class="grow"></div>
    ${open && mgr ? `<button class="btn bad sm" id="cx">გაუქმება</button><button class="btn" id="fin">✓ დასრულება და ნაშთის გასწორება</button>` : open ? `<span class="muted small">დასრულებას ადმინისტრატორი ან მენეჯერი აკეთებს</span>` : ""}</div>`);
  document.body.appendChild(bar);
  bar.querySelector(".xlb").onclick = () => { const vis = showSys || !open;
    xlsxSave(`${head.title}`, [{ name: "ინვენტარიზაცია", rows: [["კოდი", "დასახელება", "კატეგორია", "ბარკოდი", ...(vis ? ["პროგრამით"] : []), "დათვლილი", ...(vis ? ["სხვაობა", "თვითღირებულება", "სხვაობა ₾"] : [])],
      ...lines.map(l => { const d = diffOf(l); return [l.product?.code, l.product?.name, catName(l.product?.category_id), l.product?.barcode || "", ...(vis ? [sysOf(l)] : []), l.counted_qty ?? "", ...(vis ? [d ?? "", cost(l) || "", d != null && cost(l) ? Math.round(d * cost(l) * 100) / 100 : ""] : [])]; })] }]); };
  bar.querySelector("#pr").onclick = () => invPrint(head, lines, showSys || !open, catName);
  bar.querySelector("#xin")?.addEventListener("click", () => invExcelIn(lines, (l, v) => setQty(l, v), () => draw()));
  bar.querySelector("#cx")?.addEventListener("click", async () => { if (!(await ask("ინვენტარიზაცია გაუქმდეს? ნაშთი არ შეიცვლება.", "გაუქმება", true))) return;
    try { await q(sb.rpc("inv_count_cancel", { p_count: id })); LS.set("c:inv:list", null); toast("გაუქმდა"); bar.remove(); viewInventory(main); } catch (e) { fail(e); } });
  bar.querySelector("#fin")?.addEventListener("click", () => invFinish(main, head, lines, { cost, sysOf }, () => { filter = "todo"; limit = 150; draw(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  draw();
}

function invFinish(main, head, lines, { cost, sysOf }, showTodo) {
  const pend = outbox.all().filter(o => o.type === "inv_set" && o.count_id === head.id).length;
  if (pend) return toast(`${pend} დათვლა ჯერ ამ მოწყობილობაზეა — ჯერ დააჭირე სინქრონიზაციას`, true);
  const done = lines.filter(l => l.counted_qty != null), todo = lines.filter(l => l.counted_qty == null);
  let sq = 0, sv = 0, pq = 0, pv = 0, n = 0;
  done.forEach(l => { const d = Number(l.counted_qty) - sysOf(l); if (!d) return; n++; if (d < 0) { sq -= d; sv -= d * cost(l); } else { pq += d; pv += d * cost(l); } });
  modal(`<h3>დასრულება და ნაშთის გასწორება</h3>
    <div class="muted">დათვლილია <b>${done.length}</b> / ${lines.length} პოზიცია.</div>
    ${todo.length ? `<div class="warnbox"><div class="row" style="align-items:flex-start"><div class="grow"><b>⚠ ${todo.length} პოზიცია არ დათვლილა</b>
        <div class="small" style="margin-top:2px">მათი ნაშთი უცვლელი დარჩება. პროგრამით ამ პოზიციებზე სულ ${qtyf(todo.reduce((a, l) => a + sysOf(l), 0))} ცალია.</div>
        <div class="small muted" style="margin-top:4px">${todo.slice(0, 12).map(l => `<span class="fchip">${esc(l.product?.code)}</span>`).join("")}${todo.length > 12 ? ` +${todo.length - 12}` : ""}</div></div>
        <button class="btn ghost sm" id="see">ნახვა</button></div></div>` : `<div class="okbox">✓ ყველა პოზიცია დათვლილია</div>`}
    <div class="kpis" style="margin:12px 0"><div class="card kpi"><div class="muted">გასწორდება</div><div class="v">${n}</div><div class="small muted">პოზიცია</div></div>
      <div class="card kpi"><div class="muted">ნაკლი</div><div class="v neg">${qtyf(sq)}</div><div class="small muted">${sv ? money(sv) : "ცალი"}</div></div>
      <div class="card kpi"><div class="muted">ზედმეტი</div><div class="v pos">${qtyf(pq)}</div><div class="small muted">${pv ? money(pv) : "ცალი"}</div></div></div>
    <div class="note">სხვაობა დასრულების მომენტის ნაშთთან ითვლება — ინვენტარიზაციის დროს გასული შეკვეთები და RS ზედნადებებიც გათვალისწინებული იქნება. გასწორება ნაშთის ისტორიაში „ინვენტარიზაცია“-დ ჩაიწერება.</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-a="x">უკან</button><button class="btn" id="ok">✓ დასრულება</button></div>`,
    (m, close) => {
      m.querySelector('[data-a=x]').onclick = close;
      m.querySelector("#see")?.addEventListener("click", () => { close(); showTodo(); });
      m.querySelector("#ok").onclick = async (ev) => {
        ev.target.disabled = true;
        try { const r = await q(sb.rpc("inv_count_finish", { p_count: head.id, p_uncounted: "keep" }));
          close(); ["c:inv:list", "c:inv:h:" + head.id, "c:inv:l:" + head.id, "c:stock"].forEach(k => LS.set(k, null)); S.cache = {};
          toast(`დასრულდა · გასწორდა ${r.adjusted} პოზიცია${r.uncounted ? ` · ${r.uncounted} დაუთვლელი უცვლელია` : ""}`); invScreen(main, head.id);
        } catch (e) { fail(e); ev.target.disabled = false; }
      };
    });
}

function invExcelIn(lines, set, redraw) {
  modal(`<h3>დათვლილი რაოდენობები ექსელიდან</h3><div class="muted small">საკმარისია ორი სვეტი: <b>კოდი</b> (ან ბარკოდი) და <b>რაოდენობა</b>. ერთი და იგივე კოდი რამდენჯერაც არ უნდა იყოს, დაჯამდება.</div>
    <input type="file" id="f" accept=".xlsx,.xls,.csv" style="margin-top:10px"><div id="pv" style="margin-top:10px"></div>
    <label class="check"><input type="checkbox" id="add"> არსებულ დათვლას დაემატოს (თუ არ მონიშნავ — ჩანაცვლდება)</label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-a="x">დახურვა</button><button class="btn" id="go" disabled>ჩაწერა</button></div>`,
    (m, close) => {
      let items = [];
      m.querySelector('[data-a=x]').onclick = close;
      m.querySelector("#f").onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return; const pv = m.querySelector("#pv"); pv.innerHTML = loading();
        try {
          const rows = (await readSheet(file)).filter(r => r && r.some(v => v != null && v !== ""));
          const hi = rows.findIndex(r => r.some(v => /კოდ|code|bh|ბარკ|barcode/i.test(String(v ?? ""))));
          const h0 = hi >= 0 ? rows[hi].map(v => String(v ?? "")) : [];
          let cc = h0.findIndex(v => /კოდ|code|bh|ბარკ|barcode/i.test(v)), qc = h0.findIndex(v => /დათვლ|რაოდ|qty|count|ნაშთ|ცალ/i.test(v));
          const data = rows.slice(hi + 1);
          if (cc < 0) cc = 0; if (qc < 0) qc = h0.length ? h0.length - 1 : 1;
          const agg = new Map(), miss = [];
          const byBar = new Map(lines.filter(l => l.product?.barcode).map(l => [String(l.product.barcode).replace(/\s/g, ""), l])), byC = new Map(lines.map(l => [String(l.product?.code).toUpperCase(), l]));
          data.forEach(r => { const raw = String(r[cc] ?? "").trim(), qn = toNum(r[qc]); if (!raw || qn == null) return;
            const l = byBar.get(raw.replace(/\s/g, "")) || byC.get(parseCode(raw)); if (!l) { miss.push(raw); return; }
            agg.set(l, (agg.get(l) || 0) + qn); });
          items = [...agg.entries()];
          pv.innerHTML = `<div class="card" style="background:var(--brand-soft);border-color:transparent"><b>${items.length}</b> პოზიცია · <b>${qtyf(items.reduce((a, x) => a + x[1], 0))}</b> ცალი${miss.length ? `<div class="small" style="color:var(--bad);margin-top:4px">ამ სიაში არ არის (${miss.length}): ${miss.slice(0, 20).map(esc).join(", ")}${miss.length > 20 ? "…" : ""}</div>` : ""}</div>`;
          m.querySelector("#go").disabled = !items.length;
        } catch (er) { pv.innerHTML = `<div class="small" style="color:var(--bad)">${esc(er.message)}</div>`; }
      };
      m.querySelector("#go").onclick = () => { const add = m.querySelector("#add").checked;
        items.forEach(([l, v]) => set(l, add ? Number(l.counted_qty || 0) + v : v)); close(); redraw(); toast(`ჩაიწერა ${items.length} პოზიცია`); };
    });
}

function invPrint(head, lines, vis, catName) {
  const w = window.open("", "_blank"); if (!w) return toast("ბრაუზერმა ფანჯარა დაბლოკა", true);
  const groups = new Map(); lines.forEach(l => { const c = catName(l.product?.category_id) || "სხვა"; if (!groups.has(c)) groups.set(c, []); groups.get(c).push(l); });
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(head.title)}</title><style>
    body{font:12px "Noto Sans Georgian",Arial,sans-serif;margin:18px;color:#111}h1{font-size:17px;margin:0}h2{font-size:13px;margin:16px 0 4px;background:#eee;padding:4px 6px}
    table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:4px 6px}th{background:#f4f4f4;font-size:11px}td.n{text-align:right;width:70px}td.b{width:90px}.c{font-weight:700;white-space:nowrap}
    .meta{color:#555;margin:4px 0 10px}.sig{display:flex;gap:40px;margin-top:30px}.sig div{flex:1;border-top:1px solid #333;padding-top:4px;color:#555}@media print{h2{break-after:avoid}tr{break-inside:avoid}}</style></head><body>
    <h1>${esc(head.title)}</h1><div class="meta">შპს ელ თი ზი 2024 · ${new Date().toLocaleDateString("ka-GE")} · ${lines.length} პოზიცია${head.blind ? " · ბრმა დათვლა" : ""}</div>
    ${[...groups].map(([g, ls]) => `<h2>${esc(g)} (${ls.length})</h2><table><thead><tr><th>კოდი</th><th>დასახელება</th>${vis ? "<th>პროგრამით</th>" : ""}<th>დათვლილი</th><th>შენიშვნა</th></tr></thead><tbody>
      ${ls.map(l => `<tr><td class="c">${esc(l.product?.code)}</td><td>${esc(l.product?.name)}</td>${vis ? `<td class="n">${qtyf(l.system_qty)}</td>` : ""}<td class="b">${l.counted_qty ?? ""}</td><td style="width:110px"></td></tr>`).join("")}</tbody></table>`).join("")}
    <div class="sig"><div>დათვალა</div><div>შეამოწმა</div><div>თარიღი</div></div><script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

async function viewSummary(main) {
  main.innerHTML = `<div class="grid2" style="max-width:420px"><div><label>დან</label><input type="date" id="d1" value="${today(-30)}"></div><div><label>მდე</label><input type="date" id="d2" value="${today()}"></div></div><div id="out" style="margin-top:12px">${loading()}</div>`;
  const run = async () => {
    const out = main.querySelector("#out"); out.innerHTML = loading();
    try {
      const rows = await q(sb.from("orders").select("id, status, total, vat_total, order_date, outlet:outlets(customer:customers(name, network)), delivery:deliveries(cash_received)")
        .gte("order_date", main.querySelector("#d1").value).lte("order_date", main.querySelector("#d2").value).in("status", ["shipped","delivered"]).limit(5000));
      const tot = rows.reduce((a, o) => a + Number(o.total), 0), vat = rows.reduce((a, o) => a + Number(o.vat_total), 0);
      const cash = rows.reduce((a, o) => a + Number((Array.isArray(o.delivery) ? o.delivery[0] : o.delivery)?.cash_received || 0), 0);
      const by = new Map(); rows.forEach(o => { const k = o.outlet?.customer?.network || o.outlet?.customer?.name || "—"; by.set(k, (by.get(k) || 0) + Number(o.total)); });
      out.innerHTML = `<div class="kpis"><div class="card kpi"><div class="muted small">გაყიდვა (გასული)</div><div class="v">${money(tot)}</div></div>
        <div class="card kpi"><div class="muted small">მ.შ. დღგ</div><div class="v">${money(vat)}</div></div>
        <div class="card kpi"><div class="muted small">ექსპედიტორის აღებული</div><div class="v">${money(cash)}</div></div>
        <div class="card kpi"><div class="muted small">შეკვეთა</div><div class="v">${rows.length}</div></div></div>
        <div class="card"><table><thead><tr><th>ქსელი / კლიენტი</th><th class="right">გაყიდვა</th></tr></thead><tbody>
        ${[...by].sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="right num">${money(v)}</td></tr>`).join("") || `<tr><td colspan="2" class="empty">ცარიელია</td></tr>`}</tbody></table></div>`;
    } catch (e) { fail(e); }
  };
  main.querySelector("#d1").onchange = run; main.querySelector("#d2").onchange = run; run();
}

// ---------- install as an app ----------
let installEvt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; document.querySelectorAll(".inst").forEach(b => b.style.display = ""); });
window.addEventListener("appinstalled", () => { installEvt = null; document.querySelectorAll(".inst").forEach(b => b.remove()); toast("აპი დაყენდა ✓"); });
function installBtnHtml(cls = "") { return (isStandalone() || (!installEvt && !isIOS())) ? `<button class="btn sec inst ${cls}" style="display:none">⬇ დაყენება</button>` : `<button class="btn sec inst ${cls}">⬇ დაყენება</button>`; }
function wireInstall(root) {
  root.querySelectorAll(".inst").forEach(b => b.onclick = async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; return; }
    modal(isIOS()
      ? `<h3>iPhone-ზე დაყენება</h3><ol><li>Safari-ში დააჭირე <b>გაზიარება</b> ღილაკს (⬆ კვადრატი ისრით)</li><li>აირჩიე <b>„Add to Home Screen“ / „ეკრანზე დამატება“</b></li><li>დააჭირე <b>Add</b></li></ol><button class="btn" data-a="x">კარგი</button>`
      : `<h3>დაყენება</h3><p>Chrome-ში ან Edge-ში: მისამართის ზოლის მარჯვნივ დააჭირე <b>⊕ / „Install“</b> ხატულას, ან მენიუ ⋮ → <b>„Install app“ / „Add to Home screen“</b>.</p><button class="btn" data-a="x">კარგი</button>`,
      (m, close) => m.querySelector('[data-a=x]').onclick = close);
  });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { S.profile = null; } });
boot();
</script>
